# Decision-specific micro-lessons.
#
# "Dynamic" Learn means Ruko SELECTS and ORDERS these short, curated lessons for this
# decision and fills them with the user's own numbers. The LLM never writes lesson text.
#
# Texts live in data/templates/{locale}.yaml (response_type: lesson), like every other
# user-facing string, so the template linter, the output validator, the English fallback
# and /v1/speak all apply unchanged:
#   lesson.<id>.title
#   lesson.<id>.body          (no numbers of the user)
#   lesson.<id>.body_amount   (only if amount_slot: true; slot {amount} = the user's rupees)
#
# The Learn list (the app's Learn screen) shows EVERY lesson, whether or not a decision
# triggers it, so people can learn without waiting for a pause. Triggers only decide which
# lessons ride along with a decision; a lesson with no triggers is "evergreen" and appears
# only in the Learn list and as a one-line "worth knowing" suggestion on quiet results.
#   lesson.<id>.summary       one line shown in the Learn list
#   learn.topic.<topic>       heading of a topic in the Learn list
#
# Fields:
#   topic:             which Learn-list heading the lesson sits under (see `topics`)
#   introductory:      a beginner's lesson; goes last for someone who is already regular at it
#   about_products / about_tools / about_terms / about_stages:
#                      what the lesson is about; used to suggest it next to a decision,
#                      a calculation or a glossary answer on the same subject
#   own_guidance:      true = Ruko's general habit advice with no factual claim (so no fact to
#                      cite); the app labels it as such. Every other lesson must cite a fact.
#   boost_when:        post_loss | frequent_trading | late_night: moves the lesson up for someone who says so
#   priority:          higher first (after safety-critical lessons)
#   safety_critical:   shown even if seen before, and kept ahead of non-critical items
#   triggers:          a list of condition sets (may be empty: evergreen); the lesson
#                      applies to a decision if ANY set matches.
#                      Inside a set every key must match; inside a key any value matches.
#                      Keys: stage_in, product_class_in, action_in, reason_codes_any,
#                      calc_tool_in, needs (amount | leverage)
#   related_card:      a card that says the short version of this lesson; when the lesson
#                      is chosen, that card is left out (same topic once, not twice)
#   related_tool:      a calculator the lesson points to (the app may offer it)
#   slots:             none | holding_months (from the capital-gains fact)
#   facts:             fact IDs the lesson relies on (sources + as_of travel with it)
#   read_seconds:      estimated reading time of the English text (about 3 words a second)
#   verified_by_human: the lesson TEXT has been checked by a human (all locales)
#   as_of:             date the text was written against its sources
#
# In production (show_unverified_facts: false) a lesson is shown only if its text and all
# its facts are verified by a human.
version: "1"

max_lessons: 2              # per decision
max_explanation_items: 3    # cards + lessons together
pause_min_level: L2         # same as cards: L1 stays one line and one question

topics: [basics, scams, habits, numbers]   # order of the headings in the Learn list

# The default reading order: what a newcomer meets first. Seen lessons drop out; what the
# person says about themselves (experience, a recent loss, frequent trading) re-orders it.
path:
  - risk_and_return
  - shares_basics
  - mutual_funds_basics
  - guaranteed_returns
  - forwarded_tips
  - check_registration
  - decision_plan
  - emergency_money
  - diversification
  - sip_adds_up
  - compounding_time
  - ipo_basics
  - leverage_basics
  - never_pay_to_withdraw
  - selling_costs_tax

lessons:
  - id: never_pay_to_withdraw
    topic: scams
    priority: 95
    safety_critical: true
    triggers:
      - {reason_codes_any: [WITHDRAWAL_FEE_DEMAND]}
    related_card: null
    related_tool: null
    amount_slot: false
    slots: none
    facts: ["investor_pages:fake_trading_app_scam"]
    read_seconds: 30
    verified_by_human: false
    as_of: "2026-10-04"

  - id: guaranteed_returns
    topic: scams
    priority: 90
    safety_critical: true
    triggers:
      - {reason_codes_any: [GUARANTEED_RETURN_CLAIM]}
    related_card: no_assured_returns
    related_tool: null
    amount_slot: false
    slots: none
