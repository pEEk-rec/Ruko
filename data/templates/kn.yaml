    status: draft
  verdict.cannot_vouch:
    text: "Ruko ಯಾವುದೇ ಟಿಪ್, ಆ್ಯಪ್ ಅಥವಾ ವ್ಯಕ್ತಿಯ ಬಗ್ಗೆ ಭರವಸೆ ಕೊಡುವುದಿಲ್ಲ. ಮೆಸೇಜ್‌ನಲ್ಲಿ ಅದು ಗಮನಿಸಿದ್ದು ಇಷ್ಟು."
    response_type: content_report
    status: draft

