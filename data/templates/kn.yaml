    text: "ಇದು ಸಾಮಾನ್ಯ ವಿವರಣೆ, ಯಾವುದೇ ಪ್ರಾಡಕ್ಟ್ ಬಗ್ಗೆ ಅಭಿಪ್ರಾಯವಲ್ಲ."
