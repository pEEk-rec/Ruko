    response_type: journal_highlight
    status: draft
  journal.highlight.plans_followed:
    text: "ಏನಾಯಿತು ಎಂದು ನೀವು ನಂತರ ಬರೆದ ಕಡೆ, {pct}% ಬಾರಿ ನಿಮ್ಮ ಸ್ವಂತ ಯೋಜನೆಯನ್ನು ಪಾಲಿಸಿದ್ದೀರಿ."
    response_type: journal_highlight
    status: draft
  journal.highlight.pause_completion:
    text: "Ruko ನ {pct}% ವಿರಾಮಗಳನ್ನು ನೀವು ಕೊನೆಯವರೆಗೆ ಓದಿದ್ದೀರಿ."
    response_type: journal_highlight
    status: draft
  journal.highlight.comprehension:
    text: "{pct}% ವಿರಾಮಗಳ ನಂತರ ವಿರಾಮ ಏಕೆ ಬಂತು ಎಂದು ನೀವು ಹೇಳಬಲ್ಲಿರಿ."
    response_type: journal_highlight
    status: draft
  journal.highlight.reconsideration:
    text: "{pct}% ವಿರಾಮಗಳ ನಂತರ ನೀವು ಮೊತ್ತ ಬದಲಿಸಿದಿರಿ, ಕಾದಿರಿ, ಯೋಜನೆ ಬರೆದಿರಿ, ಅಥವಾ ಬಿಟ್ಟುಬಿಟ್ಟಿರಿ."
    response_type: journal_highlight
    status: draft
  journal.highlight.overrides:
    text: "ನೀವು {with_reason} ಬಾರಿ ಕಾರಣ ಬರೆದು ಮತ್ತು {without_reason} ಬಾರಿ ಕಾರಣವಿಲ್ಲದೆ ವಿರಾಮದ ನಂತರ ಮುಂದುವರಿದಿರಿ. ಎರಡೂ ನಿಮ್ಮ ನಿರ್ಧಾರಗಳೇ."
    response_type: journal_highlight
    status: draft
  journal.articulation.growing:
    text: "ಕಾಲಾನಂತರದಲ್ಲಿ ನೀವು ನಿಮ್ಮ ಸ್ವಂತ ನಿಯಮಗಳು ಮತ್ತು ಯೋಜನೆಗಳನ್ನು ಹೆಚ್ಚು ಬರೆದಿದ್ದೀರಿ."
