  lesson.never_pay_to_withdraw.title:
    text: "ಹಣ ತೆಗೆಯುವ ಮೊದಲು ಶುಲ್ಕ ಕೇಳಿದರೆ"
    response_type: lesson
    status: draft
  lesson.never_pay_to_withdraw.body:
    text: "SEBI ಯ ನಕಲಿ ಟ್ರೇಡಿಂಗ್ ಆ್ಯಪ್ ಮಾರ್ಗದರ್ಶಿಯಲ್ಲಿ 'ಹಣ ತೆಗೆಯುವಿಕೆ ತಡೆ' ಎಂಬ ಹಂತವಿದೆ: ಹಣ ತೆಗೆಯಲು ಪ್ರಯತ್ನಿಸಿದಾಗ ನೆಪಗಳು ಮತ್ತು ಶುಲ್ಕಗಳು ಬರುತ್ತವೆ. ನಿಮ್ಮದೇ ಹಣ ತೆಗೆಯುವ ಮೊದಲು ಯಾರಿಗಾದರೂ ಶುಲ್ಕ, ತೆರಿಗೆ ಅಥವಾ 'ಡೆಪಾಸಿಟ್' ಕಳಿಸಲು ಕೇಳಿದರೆ, ಮುಂದೆ ಯಾವುದೇ ಪಾವತಿ ಮಾಡುವ ಮೊದಲು ನೀವು ನಿಲ್ಲಬಹುದು. ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಮತ್ತು ಪಾವತಿ ವಿವರಗಳನ್ನು ಇಟ್ಟುಕೊಳ್ಳಿ. Ruko ದ 'ಹಣ ಪಾವತಿಸಿದ್ದೇನೆ' ಹಂತಗಳು ದೂರು ಎಲ್ಲಿ ನೀಡಬೇಕೆಂದು ತೋರಿಸುತ್ತವೆ. ನಿರ್ಧಾರ ನಿಮ್ಮದು."
    response_type: lesson
    status: draft
  lesson.guaranteed_returns.title:
    text: "ಭರವಸೆ ನೀಡಿದ ಲಾಭ ಏಕೆ ಮುಖ್ಯ"
    response_type: lesson
    status: draft
  lesson.guaranteed_returns.body:
    text: "SEBI ಯ ವಂಚನೆ ಗುರುತಿಸುವ ಮಾರ್ಗದರ್ಶಿ ಹೇಳುವಂತೆ, ಖಚಿತ ಅಥವಾ ಬಹುತೇಕ ಖಚಿತ ಲಾಭದ ಭರವಸೆ ನೀಡುವ ಯಾರ ಬಗ್ಗೆಯೂ ಸಂಶಯಪಡಿ, ಏಕೆಂದರೆ ಸೆಕ್ಯುರಿಟೀಸ್ ಮಾರುಕಟ್ಟೆಯ ಪ್ರತಿ ಹೂಡಿಕೆಯಲ್ಲೂ ಸ್ವಲ್ಪ ಅಪಾಯ ಇರುತ್ತದೆ. ನೋಂದಾಯಿತ ಹೂಡಿಕೆ ಸಲಹೆಗಾರರು ಲಾಭಕ್ಕೆ ಗ್ಯಾರಂಟಿ ನೀಡುವುದನ್ನು ನಿಷೇಧಿಸಲಾಗಿದೆ ಎಂದು SEBI ಯ ಹೂಡಿಕೆದಾರ ವೆಬ್‌ಸೈಟ್ ಕೂಡ ಹೇಳುತ್ತದೆ. ಯಾವುದೇ ಮೆಸೇಜ್ ನಿಗದಿತ ಅಥವಾ ದಿನನಿತ್ಯದ ಲಾಭದ ಭರವಸೆ ನೀಡಿದರೆ, ಕಳಿಸಿದವರ ಕಥೆಯನ್ನಲ್ಲ, ಭರವಸೆಯನ್ನೇ ನೋಡಿ. Ruko ಯಾವುದೇ ಟಿಪ್, ಆ್ಯಪ್ ಅಥವಾ ವ್ಯಕ್ತಿಗೆ ಖಾತರಿ ನೀಡಲು ಸಾಧ್ಯವಿಲ್ಲ."
    response_type: lesson
    status: draft
  lesson.check_registration.title:
    text: "ನೋಂದಣಿಯನ್ನು ನೀವೇ ಪರಿಶೀಲಿಸಿ"
    response_type: lesson
    status: draft
  lesson.check_registration.body:
    text: "ಯಾರು ಬೇಕಾದರೂ ತಾವು ನೋಂದಾಯಿತರು ಎಂದು ಬರೆಯಬಹುದು ಅಥವಾ ಪ್ರಮಾಣಪತ್ರ ತೋರಿಸಬಹುದು. SEBI ಮಾನ್ಯತೆ ಪಡೆದ ಅಥವಾ ನೋಂದಾಯಿತ ಮಧ್ಯವರ್ತಿಗಳೊಂದಿಗೆ ಮಾತ್ರ ವ್ಯವಹರಿಸಿ, ಮತ್ತು ಆ್ಯಪ್ ಅನ್ನು ಎಕ್ಸ್‌ಚೇಂಜ್‌ಗಳ ವೆಬ್‌ಸೈಟ್ ಅಥವಾ SEBI ಹೂಡಿಕೆದಾರ ವೆಬ್‌ಸೈಟ್‌ನ 'ನೋಂದಾಯಿತ ಮೊಬೈಲ್ ಟ್ರೇಡಿಂಗ್ ಆ್ಯಪ್ಸ್' ವಿಭಾಗದಲ್ಲಿ ಪರಿಶೀಲಿಸಿ ಎಂದು SEBI ಮಾರ್ಗದರ್ಶಿಗಳು ಹೇಳುತ್ತವೆ. Ruko ಇದನ್ನು ನಿಮಗಾಗಿ ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ. ಲಿಂಕ್‌ಗಳು ಕೆಳಗಿನ ಮೂಲಗಳಲ್ಲಿವೆ, ನಿರ್ಧರಿಸುವ ಮೊದಲು ನೀವೇ ನೋಡಬಹುದು."
    response_type: lesson
    status: draft
  lesson.leverage_basics.title:
    text: "ಲೆವರೇಜ್ ನಿಮ್ಮ ಹಣಕ್ಕೆ ಏನು ಮಾಡುತ್ತದೆ"
    response_type: lesson
    status: draft
  lesson.leverage_basics.body:
    text: "ಲೆವರೇಜ್ ಎಂದರೆ ಪೊಸಿಷನ್ ನೀವು ಹಾಕಿದ ಹಣಕ್ಕಿಂತ ದೊಡ್ಡದು. ಆಗ ಬೆಲೆಯ ನಿರ್ದಿಷ್ಟ ಚಲನೆ ನಿಮ್ಮ ಸ್ವಂತ ಹಣದ ಮೇಲೆ ಎರಡೂ ದಿಕ್ಕಿನಲ್ಲಿ ಹೆಚ್ಚು ಪರಿಣಾಮ ಬೀರುತ್ತದೆ. ಡೆರಿವೇಟಿವ್‌ನಲ್ಲಿ ನೀವು ಹಾಕಿದ ಮಾರ್ಜಿನ್‌ನ ಭಾಗ ಅಥವಾ ಪೂರ್ತಿ ಕಳೆದುಕೊಳ್ಳಬಹುದು, ನಷ್ಟ ಮೂಲ ಮಾರ್ಜಿನ್‌ಗಿಂತ ಹೆಚ್ಚೂ ಆಗಬಹುದು ಎಂದು SEBI ಯ ಅಪಾಯ ಬಹಿರಂಗ ದಾಖಲೆ ಹೇಳುತ್ತದೆ. ಇದು ಗಾತ್ರದ ಲೆಕ್ಕ, ಬೆಲೆಗಳ ಮುನ್ಸೂಚನೆ ಅಲ್ಲ."
    response_type: lesson
    status: draft
  lesson.leverage_basics.body_amount:
    text: "ಲೆವರೇಜ್ ಎಂದರೆ ಪೊಸಿಷನ್ ನೀವು ಹಾಕಿದ ಹಣಕ್ಕಿಂತ ದೊಡ್ಡದು. ಕೇವಲ ಲೆಕ್ಕ: ನಿಮ್ಮ {amount} ಹಣದ ಹತ್ತು ಪಟ್ಟು ಗಾತ್ರದ ಪೊಸಿಷನ್ 10% ಇಳಿದರೆ, ನಷ್ಟ ನಿಮ್ಮ ಪೂರ್ತಿ {amount} ಗೆ ಸಮ. ಡೆರಿವೇಟಿವ್‌ನಲ್ಲಿ ಮಾರ್ಜಿನ್‌ನ ಭಾಗ ಅಥವಾ ಪೂರ್ತಿ ಕಳೆದುಕೊಳ್ಳಬಹುದು, ನಷ್ಟ ಮೂಲ ಮಾರ್ಜಿನ್‌ಗಿಂತ ಹೆಚ್ಚೂ ಆಗಬಹುದು ಎಂದು SEBI ಯ ಅಪಾಯ ಬಹಿರಂಗ ದಾಖಲೆ ಹೇಳುತ್ತದೆ. ಇದು ಗಾತ್ರದ ಬಗ್ಗೆ, ಬೆಲೆಗಳ ಮುನ್ಸೂಚನೆ ಅಲ್ಲ."
    response_type: lesson
    status: draft
  lesson.ipo_basics.title:
    text: "IPO ಅರ್ಜಿ ಎಂದರೇನು"
    response_type: lesson
    status: draft
  lesson.ipo_basics.body:
    text: "IPO ಯಲ್ಲಿ ನೀವು ಷೇರುಗಳಿಗೆ ಅರ್ಜಿ ಹಾಕುತ್ತೀರಿ, ನಿಮಗೆ ಯಾವುದೇ ಷೇರು ಹಂಚಿಕೆಯಾಗದೇ ಇರಬಹುದು. SEBI ವಿವರಿಸುವಂತೆ ASBA ಅರ್ಜಿಯಲ್ಲಿ ಹಣ ನಿಮ್ಮ ಖಾತೆಯಲ್ಲೇ ಇರುತ್ತದೆ ಆದರೆ ಹಂಚಿಕೆಯವರೆಗೆ ತಡೆಹಿಡಿಯಲಾಗುತ್ತದೆ; ಹಂಚಿಕೆಯಾದ ಷೇರುಗಳ ಮೊತ್ತ ಮಾತ್ರ ಕಡಿತವಾಗುತ್ತದೆ, ಹಂಚಿಕೆಯಾಗದಿದ್ದರೆ ಮರುಪಾವತಿ ಬೇಕಿಲ್ಲ. ಅರ್ಜಿ ಎಂದರೆ ಆಫರ್‌ನ ನಿಯಮಗಳಲ್ಲಿ ಷೇರು ಕೇಳುವುದು. ಲಿಸ್ಟಿಂಗ್ ನಂತರ ಷೇರುಗಳು ಹೇಗೆ ವಹಿವಾಟಾಗುತ್ತವೆ ಎಂಬುದನ್ನು ಅದು ಹೇಳುವುದಿಲ್ಲ."
    response_type: lesson
    status: draft
  lesson.sip_adds_up.title:
    text: "ನಿಯಮಿತ ಕಂತುಗಳು ಹೇಗೆ ಕೂಡುತ್ತವೆ"
    response_type: lesson
    status: draft
  lesson.sip_adds_up.body:
    text: "SIP ಯಲ್ಲಿ ನಿಗದಿತ ಮೊತ್ತವನ್ನು ನಿಯಮಿತ ಅಂತರದಲ್ಲಿ ಹಾಕಲಾಗುತ್ತದೆ. ಒಟ್ಟು ಮೊತ್ತ ಎರಡರಿಂದ ಆಗುತ್ತದೆ: ನೀವು ಹಾಕಿದ್ದು, ಅದು ತಿಂಗಳುಗಳೊಂದಿಗೆ ಹೆಚ್ಚುತ್ತದೆ, ಮತ್ತು ಆ ಹಣದ ಮೌಲ್ಯ, ಅದು ಲಾಭದ ಮೇಲೆ ಅವಲಂಬಿತ ಮತ್ತು ಅದನ್ನು ಮುಂಚಿತವಾಗಿ ಯಾರೂ ತಿಳಿಯಲಾಗದು. ಅದಕ್ಕಾಗಿಯೇ ಕ್ಯಾಲ್ಕುಲೇಟರ್ ಒಂದು ಸಂಖ್ಯೆಯ ಬದಲು ಹಲವು ಉದಾಹರಣೆ ದರಗಳನ್ನು ಪಕ್ಕಪಕ್ಕದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ. ಲೆಕ್ಕ ಪರೀಕ್ಷಿಸಲು SEBI ಯ ಹೂಡಿಕೆದಾರ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲೂ ಕ್ಯಾಲ್ಕುಲೇಟರ್‌ಗಳಿವೆ."
    response_type: lesson
    status: draft
  lesson.sip_adds_up.body_amount:
    text: "SIP ಯಲ್ಲಿ ನಿಗದಿತ ಮೊತ್ತವನ್ನು ನಿಯಮಿತ ಅಂತರದಲ್ಲಿ ಹಾಕಲಾಗುತ್ತದೆ, ಇಲ್ಲಿ ತಿಂಗಳಿಗೆ {amount}. ಒಟ್ಟು ಮೊತ್ತ ಎರಡರಿಂದ ಆಗುತ್ತದೆ: ನೀವು ಹಾಕಿದ್ದು, ಅದು ತಿಂಗಳುಗಳೊಂದಿಗೆ ಹೆಚ್ಚುತ್ತದೆ, ಮತ್ತು ಆ ಹಣದ ಮೌಲ್ಯ, ಅದು ಲಾಭದ ಮೇಲೆ ಅವಲಂಬಿತ ಮತ್ತು ಅದನ್ನು ಮುಂಚಿತವಾಗಿ ಯಾರೂ ತಿಳಿಯಲಾಗದು. ಅದಕ್ಕಾಗಿಯೇ ಕ್ಯಾಲ್ಕುಲೇಟರ್ ಒಂದು ಸಂಖ್ಯೆಯ ಬದಲು ಹಲವು ಉದಾಹರಣೆ ದರಗಳನ್ನು ಪಕ್ಕಪಕ್ಕದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ. ಲೆಕ್ಕ ಪರೀಕ್ಷಿಸಲು SEBI ಯ ಹೂಡಿಕೆದಾರ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲೂ ಕ್ಯಾಲ್ಕುಲೇಟರ್‌ಗಳಿವೆ."
    response_type: lesson
    status: draft
  lesson.selling_costs_tax.title:
    text: "ಮಾರುವಾಗ ಶುಲ್ಕ ಮತ್ತು ತೆರಿಗೆ"
    response_type: lesson
    status: draft
  lesson.selling_costs_tax.body:
    text: "ಮಾರಾಟದಲ್ಲಿ ಶುಲ್ಕ ಮತ್ತು ತೆರಿಗೆ ಇರಬಹುದು, ಆದ್ದರಿಂದ ಕೈಗೆ ಬರುವ ಮೊತ್ತ ಮಾರಾಟ ಮೌಲ್ಯಕ್ಕಿಂತ ಕಡಿಮೆ ಇರಬಹುದು. ಲಿಸ್ಟ್ ಆದ ಷೇರುಗಳು ಮತ್ತು ಈಕ್ವಿಟಿ ಫಂಡ್‌ಗಳಿಗೆ ಭಾರತೀಯ ತೆರಿಗೆ ನಿಯಮಗಳು {months} ತಿಂಗಳಿಗಿಂತ ಹೆಚ್ಚಿನ ಹೋಲ್ಡಿಂಗ್ ಅನ್ನು ಕಡಿಮೆ ಅವಧಿಗಿಂತ ಬೇರೆಯಾಗಿ ಪರಿಗಣಿಸುತ್ತವೆ, ದರಗಳೂ ಬೇರೆ. Ruko ನಿಮ್ಮ ತೆರಿಗೆಯನ್ನು ಲೆಕ್ಕ ಹಾಕುವುದಿಲ್ಲ. ನಿಮಗೆ ಯಾವುದು ಅನ್ವಯಿಸುತ್ತದೆ ಎಂದು ಆದಾಯ ತೆರಿಗೆ ಇಲಾಖೆಯ ವೆಬ್‌ಸೈಟ್ ಅಥವಾ ತೆರಿಗೆ ವೃತ್ತಿಪರರು ಹೇಳಬಹುದು."
    response_type: lesson
    status: draft

