  # ಪದಕೋಶ (learn ಹಂತ)
  glossary.ipo.title:
    text: "ಐಪಿಓ (ಇನಿಷಿಯಲ್ ಪಬ್ಲಿಕ್ ಆಫರಿಂಗ್)"
    response_type: glossary
    status: draft
  glossary.ipo.body:
    text: "ಒಂದು ಕಂಪನಿ ಮೊದಲ ಬಾರಿಗೆ ಸಾರ್ವಜನಿಕರಿಗೆ ತನ್ನ ಷೇರುಗಳನ್ನು ಮಾರುವುದೇ ಐಪಿಓ. ಜನರು ನಿಗದಿತ ಅವಧಿಯಲ್ಲಿ ಅರ್ಜಿ ಹಾಕುತ್ತಾರೆ; ಅವಧಿ ಮುಗಿದ ನಂತರ ಷೇರುಗಳ ಹಂಚಿಕೆ ಆಗುತ್ತದೆ, ನಂತರ ಅವು ಸ್ಟಾಕ್ ಎಕ್ಸ್‌ಚೇಂಜ್‌ನಲ್ಲಿ ವಹಿವಾಟಿಗೆ ಬರುತ್ತವೆ. ಅರ್ಜಿ ಹಾಕಿದರೆ ಷೇರು ಸಿಗುತ್ತದೆ ಎಂದಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.fno.title:
    text: "F&O (ಫ್ಯೂಚರ್ಸ್ ಮತ್ತು ಆಪ್ಷನ್ಸ್)"
    response_type: glossary
    status: draft
  glossary.fno.body:
    text: "ಫ್ಯೂಚರ್ಸ್ ಮತ್ತು ಆಪ್ಷನ್ಸ್ ಎಂದರೆ ಷೇರು ಅಥವಾ ಸೂಚ್ಯಂಕದಂತಹ ಬೇರೊಂದರ ಮೇಲೆ ಮೌಲ್ಯ ಅವಲಂಬಿತವಾಗಿರುವ ಒಪ್ಪಂದಗಳು. ಇವನ್ನು ಮಾರ್ಜಿನ್‌ನೊಂದಿಗೆ ವಹಿವಾಟು ಮಾಡಲಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ ಬೆಲೆಯ ಸಣ್ಣ ಬದಲಾವಣೆಯೂ ಹಾಕಿದ ಹಣಕ್ಕೆ ಹೋಲಿಸಿದರೆ ರೂಪಾಯಿಗಳಲ್ಲಿ ದೊಡ್ಡ ವ್ಯತ್ಯಾಸ ತರಬಹುದು."
    response_type: glossary
    status: draft
  glossary.margin.title:
    text: "ಮಾರ್ಜಿನ್"
    response_type: glossary
    status: draft
  glossary.margin.body:
    text: "ಆ ಹಣಕ್ಕಿಂತ ದೊಡ್ಡ ಸ್ಥಾನ ತೆಗೆದುಕೊಳ್ಳಲು ಬ್ರೋಕರ್ ನಿಮ್ಮಿಂದ ಇಡಿಸುವ ಹಣವೇ ಮಾರ್ಜಿನ್. ಲಾಭ ಮತ್ತು ನಷ್ಟ ಪೂರ್ಣ ಸ್ಥಾನದ ಮೇಲೆ ಲೆಕ್ಕವಾಗುತ್ತದೆ, ಕೇವಲ ಮಾರ್ಜಿನ್ ಮೇಲೆ ಅಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.sip.title:
    text: "SIP (ಸಿಸ್ಟಮ್ಯಾಟಿಕ್ ಇನ್ವೆಸ್ಟ್‌ಮೆಂಟ್ ಪ್ಲಾನ್)"
    response_type: glossary
    status: draft
  glossary.sip.body:
    text: "SIP ನಲ್ಲಿ ಒಮ್ಮೆಲೇ ಹಣ ಹಾಕುವ ಬದಲು, ನಿಯಮಿತ ಅವಧಿಗೆ, ಉದಾಹರಣೆಗೆ ಪ್ರತಿ ತಿಂಗಳು, ಮ್ಯೂಚುವಲ್ ಫಂಡ್‌ಗೆ ನಿಗದಿತ ಮೊತ್ತ ಹೋಗುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.nav.title:
    text: "NAV (ನೆಟ್ ಅಸೆಟ್ ವ್ಯಾಲ್ಯೂ)"
