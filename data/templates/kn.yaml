    status: draft
  glossary.nav.body:
    text: "NAV ಎಂದರೆ ಮ್ಯೂಚುವಲ್ ಫಂಡ್‌ನ ಒಂದು ಯೂನಿಟ್‌ನ ಮೌಲ್ಯ, ಫಂಡ್ ಹೊಂದಿರುವುದರಿಂದ ಲೆಕ್ಕ ಹಾಕಲಾಗುತ್ತದೆ. ಕೇವಲ ಹೆಚ್ಚು ಅಥವಾ ಕಡಿಮೆ NAV ಫಂಡ್ ಉತ್ತಮವೋ ಕೆಟ್ಟದೋ ಎಂದು ಹೇಳುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.intraday.title:
