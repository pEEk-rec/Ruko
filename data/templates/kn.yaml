  lesson.risk_and_return.title:
    text: "ಅಪಾಯ ಮತ್ತು ಲಾಭ ಜೊತೆಯಾಗಿ ಬರುತ್ತವೆ"
    response_type: lesson
    status: draft
  lesson.risk_and_return.summary:
    text: "ದೊಡ್ಡ ಲಾಭದ ಸಾಧ್ಯತೆಯೊಂದಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ದೊಡ್ಡ ನಷ್ಟದ ಸಾಧ್ಯತೆ ಏಕೆ ಬರುತ್ತದೆ."
    response_type: lesson
    status: draft
  lesson.risk_and_return.body:
    text: "ಪ್ರತಿ ಹೂಡಿಕೆಯಲ್ಲೂ ಸ್ವಲ್ಪ ಅಪಾಯ ಇರುತ್ತದೆ: ನಿಜವಾದ ಫಲಿತಾಂಶ ನೀವು ನಿರೀಕ್ಷಿಸಿದ್ದಕ್ಕಿಂತ ಬೇರೆಯಾಗಬಹುದು, ನಷ್ಟವೂ ಸೇರಿ. ವಂಚನೆ ಗುರುತಿಸುವ SEBI ಮಾರ್ಗದರ್ಶಿಯ ಪ್ರಕಾರ ಸೆಕ್ಯುರಿಟಿಗಳ ಮಾರುಕಟ್ಟೆಯ ಎಲ್ಲ ಹೂಡಿಕೆಗಳಲ್ಲೂ ಸ್ವಲ್ಪ ಮಟ್ಟಿನ ಅಪಾಯ ಇರುತ್ತದೆ.\n\nಸಾಮಾನ್ಯವಾಗಿ ದೊಡ್ಡ ಲಾಭದ ಸಾಧ್ಯತೆ ಇರುವುದರಲ್ಲಿ ದೊಡ್ಡ ನಷ್ಟದ ಸಾಧ್ಯತೆಯೂ ಇರುತ್ತದೆ. ಆದ್ದರಿಂದ ಅಪಾಯವಿಲ್ಲದೆ ಹೆಚ್ಚು ಲಾಭದ ಭರವಸೆ ನೀಡುವ ಸಂದೇಶವನ್ನು ಗಮನವಿಟ್ಟು ನೋಡಬೇಕು. ದಿನನಿತ್ಯ ಅಪಾಯ ಅಸ್ಥಿರತೆಯ ರೂಪದಲ್ಲಿ ಕಾಣುತ್ತದೆ: ಬೆಲೆಗಳ ಏರಿಳಿತ.\n\nಅಪಾಯ ದೂರ ಉಳಿಯಲು ಕಾರಣವಲ್ಲ, ಧುಮುಕಲೂ ಕಾರಣವಲ್ಲ. ನಿರ್ಧರಿಸುವ ಮುನ್ನ ನಷ್ಟ ನಿಮ್ಮದೇ ಎಷ್ಟು ಹಣವನ್ನು ಮುಟ್ಟುತ್ತದೆ ಎಂದು ತಿಳಿಯಲು ಅದು ಕಾರಣ."
    response_type: lesson
    status: draft
  lesson.shares_basics.title:
    text: "ಷೇರು ಹೊಂದುವುದರ ಅರ್ಥ"
