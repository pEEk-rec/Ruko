  # --- Learn list: glossary briefs, new terms, evergreen lessons ---
  glossary.ipo.brief:
    text: "ಕಂಪನಿ ಮೊದಲ ಬಾರಿಗೆ ಜನರಿಗೆ ಷೇರುಗಳನ್ನು ಮಾರುವುದು. ನಿಗದಿತ ಅವಧಿಯಲ್ಲಿ ಅರ್ಜಿ ಹಾಕುತ್ತೀರಿ; ಅರ್ಜಿ ಎಂದರೆ ಷೇರು ಹಂಚಿಕೆಯ ಭರವಸೆ ಅಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.fno.brief:
    text: "ಷೇರು ಅಥವಾ ಸೂಚ್ಯಂಕದ ಮೇಲೆ ಮೌಲ್ಯ ಅವಲಂಬಿತವಾಗಿರುವ ಒಪ್ಪಂದಗಳು. ಬೆಲೆಯಲ್ಲಿ ಸಣ್ಣ ಬದಲಾವಣೆಯೂ ಹಾಕಿದ ಹಣಕ್ಕೆ ಹೋಲಿಸಿದರೆ ನಿಮ್ಮ ರೂಪಾಯಿಗಳಲ್ಲಿ ದೊಡ್ಡ ವ್ಯತ್ಯಾಸ ಮಾಡಬಹುದು."
    response_type: glossary
    status: draft
  glossary.margin.brief:
    text: "ಆ ಹಣಕ್ಕಿಂತ ದೊಡ್ಡ ಸ್ಥಾನ ಹಿಡಿಯಲು ನೀವು ಬ್ರೋಕರ್ ಬಳಿ ಇಡುವ ಹಣ. ಲಾಭ ಮತ್ತು ನಷ್ಟ ಪೂರ್ಣ ಸ್ಥಾನದ ಮೇಲೆ ಲೆಕ್ಕವಾಗುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.sip.brief:
    text: "ಒಮ್ಮೆಗೇ ಅಲ್ಲ, ಪ್ರತಿ ತಿಂಗಳಂತೆ ನಿಯಮಿತ ಅಂತರದಲ್ಲಿ ನಿಗದಿತ ಮೊತ್ತವನ್ನು ಮ್ಯೂಚುಯಲ್ ಫಂಡ್‌ಗೆ ಹಾಕುವುದು."
    response_type: glossary
    status: draft
  glossary.nav.brief:
    text: "ಮ್ಯೂಚುಯಲ್ ಫಂಡ್‌ನ ಒಂದು ಯೂನಿಟ್‌ನ ಮೌಲ್ಯ. ಹೆಚ್ಚು ಅಥವಾ ಕಡಿಮೆ NAV ಮಾತ್ರದಿಂದ ಫಂಡ್ ಉತ್ತಮ ಅಥವಾ ಕೆಟ್ಟದೆಂದು ಆಗುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.intraday.brief:
    text: "ಅದೇ ವಹಿವಾಟಿನ ದಿನದಲ್ಲಿ ಖರೀದಿ ಮತ್ತು ಮಾರಾಟ ಮಾಡುವುದು; ರಾತ್ರಿಯಿಡೀ ಏನೂ ಉಳಿಯುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.demat.brief:
    text: "ನಿಮ್ಮ ಷೇರುಗಳು ಮತ್ತು ಇತರ ಸೆಕ್ಯುರಿಟಿಗಳನ್ನು ಎಲೆಕ್ಟ್ರಾನಿಕ್ ರೂಪದಲ್ಲಿ ಇಡುವ ಖಾತೆ."
    response_type: glossary
    status: draft
  glossary.nominee.brief:
    text: "ನಿಮಗೆ ಏನಾದರೂ ಆದರೆ ನಿಮ್ಮ ಹೂಡಿಕೆಗಳನ್ನು ಪಡೆಯಲು ನೀವು ಹೆಸರಿಸುವ ವ್ಯಕ್ತಿ."
    response_type: glossary
    status: draft
  glossary.asba.title:
    text: "ASBA"
    response_type: glossary
    status: draft
  glossary.asba.body:
    text: "ASBA ಎಂದರೆ Application Supported by Blocked Amount. ಈ ರೀತಿ IPO ಗೆ ಅರ್ಜಿ ಹಾಕಿದಾಗ ಹಣ ನಿಮ್ಮದೇ ಬ್ಯಾಂಕ್ ಖಾತೆಯಲ್ಲಿ ಇರುತ್ತದೆ, ಆದರೆ ಷೇರು ಹಂಚಿಕೆಯಾಗುವವರೆಗೆ ತಡೆಹಿಡಿಯಲಾಗುತ್ತದೆ. ನಿಮಗೆ ಹಂಚಿಕೆಯಾದ ಷೇರುಗಳಿಗೆ ಮಾತ್ರ ಅದು ಕಡಿತವಾಗುತ್ತದೆ; ಏನೂ ಸಿಗದಿದ್ದರೆ ಮರುಪಾವತಿ ಬೇಕಾಗುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.asba.brief:
    text: "IPO ಗೆ ಅರ್ಜಿ ಹಾಕುವ ವಿಧಾನ; ಹಣ ನಿಮ್ಮ ಬ್ಯಾಂಕ್ ಖಾತೆಯಲ್ಲೇ ಇದ್ದು ಷೇರು ಹಂಚಿಕೆಯಾಗುವವರೆಗೆ ತಡೆಹಿಡಿಯಲ್ಪಡುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.mutual_fund.title:
    text: "ಮ್ಯೂಚುಯಲ್ ಫಂಡ್"
    response_type: glossary
    status: draft
  glossary.mutual_fund.body:
    text: "ಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ಹಲವರ ಹಣವನ್ನು ಸೇರಿಸಿ ಷೇರು, ಬಾಂಡ್ ಅಥವಾ ಎರಡರಲ್ಲೂ ಹೂಡುತ್ತದೆ. ಫಂಡ್ ಮ್ಯಾನೇಜರ್ ಆಯ್ಕೆ ಮಾಡುತ್ತಾರೆ, ನೀವು ಫಂಡ್‌ನ ಯೂನಿಟ್‌ಗಳ ಮಾಲೀಕರಾಗುತ್ತೀರಿ; ಫಂಡ್ ಗಳಿಸಿದ್ದು ಅಥವಾ ಕಳೆದುಕೊಂಡದ್ದರಲ್ಲಿ ನಿಮ್ಮ ಪಾಲು ಇರುತ್ತದೆ. ಯೂನಿಟ್‌ನ ಬೆಲೆ ಫಂಡ್‌ನ NAV ಯಿಂದ ನಿರ್ಧಾರವಾಗುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.mutual_fund.brief:
    text: "ಹಲವರ ಹಣದ ಒಂದು ಗುಂಪು; ಫಂಡ್ ಮ್ಯಾನೇಜರ್ ನಡೆಸುತ್ತಾರೆ, ಷೇರು, ಬಾಂಡ್ ಅಥವಾ ಎರಡನ್ನೂ ಹೊಂದಿರುತ್ತದೆ. ನೀವು ಆ ಗುಂಪಿನ ಯೂನಿಟ್‌ಗಳ ಮಾಲೀಕರು."
    response_type: glossary
    status: draft
  glossary.expense_ratio.title:
    text: "ಎಕ್ಸ್ಪೆನ್ಸ್ ರೇಷಿಯೋ"
    response_type: glossary
    status: draft
  glossary.expense_ratio.body:
    text: "ಎಕ್ಸ್ಪೆನ್ಸ್ ರೇಷಿಯೋ ಎಂದರೆ ಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ನಡೆಸುವ ವಾರ್ಷಿಕ ವೆಚ್ಚ; ಫಂಡ್‌ನಲ್ಲಿರುವ ಹಣದ ಶೇಕಡಾವಾರು ಆಗಿ ತೋರಿಸಲಾಗುತ್ತದೆ. ಇದು ಫಂಡ್‌ನ ಮೌಲ್ಯದಿಂದಲೇ ಕಡಿತವಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ ಪ್ರತ್ಯೇಕ ಬಿಲ್ ಕಟ್ಟಬೇಕಿಲ್ಲ, ಆದರೆ ಫಂಡ್ ನಿಮಗೆ ಗಳಿಸುವುದನ್ನು ಇದು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.expense_ratio.brief:
    text: "ಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ವಿಧಿಸುವ ವಾರ್ಷಿಕ ಶುಲ್ಕ; ಫಂಡ್‌ನಲ್ಲಿರುವ ಹಣದ ಶೇಕಡಾವಾರು."
    response_type: glossary
    status: draft
  glossary.stock.title:
    text: "ಷೇರು (ಸ್ಟಾಕ್)"
    response_type: glossary
    status: draft
  glossary.stock.body:
    text: "ಷೇರು, ಸ್ಟಾಕ್ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ, ಕಂಪನಿಯ ಮಾಲೀಕತ್ವದ ಒಂದು ಸಣ್ಣ ಭಾಗ. ಪಟ್ಟಿಯಾದ ಕಂಪನಿಗಳ ಷೇರುಗಳನ್ನು ಸ್ಟಾಕ್ ಎಕ್ಸ್‌ಚೇಂಜ್‌ನಲ್ಲಿ ಖರೀದಿ-ಮಾರಾಟ ಮಾಡಲಾಗುತ್ತದೆ; ಖರೀದಿದಾರ-ಮಾರಾಟಗಾರರು ಹೊಸ ಬೆಲೆಗೆ ಒಪ್ಪಿದಂತೆ ಬೆಲೆ ಬದಲಾಗುತ್ತದೆ. ಷೇರು ಹೊಂದಿದರೆ ಯಾವ ಲಾಭದ ಭರವಸೆಯೂ ಸಿಗುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.stock.brief:
    text: "ಕಂಪನಿಯ ಮಾಲೀಕತ್ವದ ಒಂದು ಸಣ್ಣ ಭಾಗ. ಖರೀದಿದಾರ-ಮಾರಾಟಗಾರರು ಹೊಸ ಬೆಲೆಗೆ ಒಪ್ಪಿದಂತೆ ಎಕ್ಸ್‌ಚೇಂಜ್‌ನಲ್ಲಿ ಇದರ ಬೆಲೆ ಬದಲಾಗುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.stop_loss.title:
    text: "ಸ್ಟಾಪ್ ಲಾಸ್"
    response_type: glossary
    status: draft
  glossary.stop_loss.body:
    text: "ಸ್ಟಾಪ್ ಲಾಸ್ ಎಂದರೆ ಬೆಲೆ ನೀವು ಆರಿಸಿದ ಮಟ್ಟಕ್ಕೆ ಇಳಿದರೆ ಮಾರಿಬಿಡಿ ಎಂಬ ಸೂಚನೆ; ನಷ್ಟ ಬೆಳೆಯುತ್ತಲೇ ಹೋಗದಿರಲಿ ಎಂದು. ಆ ಮಟ್ಟ ತಲುಪಿದಾಗ ಮಾರಾಟ ಆ ಕ್ಷಣದಲ್ಲಿ ಲಭ್ಯವಿರುವ ಬೆಲೆಗೆ ನಡೆಯುತ್ತದೆ; ಅದು ನೀವು ಆರಿಸಿದ ಮಟ್ಟಕ್ಕಿಂತ ಬೇರೆಯಾಗಿರಬಹುದು, ವಿಶೇಷವಾಗಿ ಬೆಲೆಗಳು ವೇಗವಾಗಿ ಬದಲಾಗುವಾಗ."
    response_type: glossary
    status: draft
  glossary.stop_loss.brief:
    text: "ಬೆಲೆ ನೀವು ಆರಿಸಿದ ಮಟ್ಟಕ್ಕೆ ಇಳಿದರೆ ಮಾರುವ ಸೂಚನೆ. ಮಾರಾಟ ನೀವು ಆರಿಸಿದ ಬೆಲೆಗಿಂತ ಬೇರೆ ಬೆಲೆಗೆ ನಡೆಯಬಹುದು."
    response_type: glossary
    status: draft
  glossary.volatility.title:
    text: "ಅಸ್ಥಿರತೆ (ವೊಲಟಾಲಿಟಿ)"
    response_type: glossary
    status: draft
  glossary.volatility.body:
    text: "ಅಸ್ಥಿರತೆ ಎಂದರೆ ಬೆಲೆ ಎಷ್ಟು ಮತ್ತು ಎಷ್ಟು ವೇಗವಾಗಿ ಏರಿಳಿಯುತ್ತದೆ ಎಂಬುದು. ಬಹಳ ಅಸ್ಥಿರ ಬೆಲೆ ಎರಡೂ ದಿಕ್ಕುಗಳಲ್ಲಿ ದೊಡ್ಡ ಏರಿಳಿತ ಮಾಡುತ್ತದೆ. ಇದು ಏರಿಳಿತದ ಗಾತ್ರದ ಬಗ್ಗೆ ಹೇಳುತ್ತದೆ, ಬೆಲೆ ಮುಂದೆ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ ಎಂಬುದರ ಬಗ್ಗೆ ಅಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.volatility.brief:
    text: "ಬೆಲೆ ಎಷ್ಟು ಮತ್ತು ಎಷ್ಟು ವೇಗವಾಗಿ ಏರಿಳಿಯುತ್ತದೆ ಎಂಬುದು. ಇದು ಏರಿಳಿತದ ಗಾತ್ರ ಹೇಳುತ್ತದೆ, ದಿಕ್ಕನ್ನಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.diversification.title:
    text: "ವೈವಿಧ್ಯೀಕರಣ"
    response_type: glossary
    status: draft
  glossary.diversification.body:
    text: "ವೈವಿಧ್ಯೀಕರಣ ಎಂದರೆ ಹಣವನ್ನು ಬೇರೆ ಬೇರೆ ಕಡೆ ಹಂಚುವುದು; ಒಂದು ನಿರಾಶಾದಾಯಕ ಫಲಿತಾಂಶ ಎಲ್ಲವನ್ನೂ ನಿರ್ಧರಿಸದಿರಲಿ ಎಂದು. ಇದು ಯಾವುದೋ ಒಂದರ ಮೇಲಿನ ನಿಮ್ಮ ಅವಲಂಬನೆಯನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ, ಆದರೆ ಅಪಾಯವನ್ನು ಹೋಗಲಾಡಿಸುವುದಿಲ್ಲ, ನಷ್ಟವನ್ನು ಅಸಾಧ್ಯವಾಗಿಸುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.diversification.brief:
    text: "ಒಂದು ಫಲಿತಾಂಶ ಎಲ್ಲವನ್ನೂ ನಿರ್ಧರಿಸದಂತೆ ಹಣವನ್ನು ಬೇರೆ ಬೇರೆ ಕಡೆ ಹಂಚುವುದು. ಒಂದರ ಮೇಲಿನ ಅವಲಂಬನೆ ಕಡಿಮೆಯಾಗುತ್ತದೆ; ಅಪಾಯ ಹೋಗುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.compounding.title:
    text: "ಚಕ್ರಬಡ್ಡಿ (ಕಂಪೌಂಡಿಂಗ್)"
    response_type: glossary
    status: draft
  glossary.compounding.body:
    text: "ಚಕ್ರಬಡ್ಡಿ ಎಂದರೆ ನಿಮ್ಮ ಹಣದ ಮೇಲಿನ ಲಾಭ ಅದಕ್ಕೇ ಸೇರಿ ತಾನೂ ಲಾಭ ಗಳಿಸುವುದು; ಬೆಳವಣಿಗೆ ಹಿಂದಿನ ಬೆಳವಣಿಗೆಯ ಮೇಲೆ ಕಟ್ಟಲ್ಪಡುತ್ತದೆ. ಹಣ ಹೆಚ್ಚು ಕಾಲ ಇದ್ದಷ್ಟೂ ಈ ಪರಿಣಾಮ ದೊಡ್ಡದಾಗುತ್ತದೆ. ನಷ್ಟಕ್ಕೂ ಇದೇ ರೀತಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ, ಮತ್ತು ಲಾಭವನ್ನು ಮೊದಲೇ ಯಾರೂ ತಿಳಿಯಲಾರರು."
    response_type: glossary
    status: draft
  glossary.compounding.brief:
    text: "ನಿಮ್ಮ ಗಳಿಕೆ ನಿಮ್ಮ ಹಣಕ್ಕೆ ಸೇರಿ ತಾನೂ ಗಳಿಸಲು ಶುರುವಾಗುವುದು; ಬೆಳವಣಿಗೆ ಹಿಂದಿನ ಬೆಳವಣಿಗೆಯ ಮೇಲೆ ಕಟ್ಟಲ್ಪಡುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.inflation.title:
    text: "ಹಣದುಬ್ಬರ"
    response_type: glossary
    status: draft
  glossary.inflation.body:
    text: "ಹಣದುಬ್ಬರ ಎಂದರೆ ಕಾಲಕ್ರಮೇಣ ಬೆಲೆಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಏರುವುದು. ಬೆಲೆ ಏರಿದಾಗ ಅದೇ ರೂಪಾಯಿಗಳಿಂದ ಮೊದಲಿಗಿಂತ ಕಡಿಮೆ ಸಿಗುತ್ತದೆ; ಹೀಗಾಗಿ ಸುಮ್ಮನೆ ಇಟ್ಟ ಹಣ ನಿಧಾನವಾಗಿ ತನ್ನ ಖರೀದಿ ಶಕ್ತಿ ಕಳೆದುಕೊಳ್ಳುತ್ತದೆ. ಆದ್ದರಿಂದಲೇ ಲಾಭವನ್ನು ಹಾಕಿದ ರೂಪಾಯಿಗಳೊಂದಿಗೆ ಮಾತ್ರವಲ್ಲ, ಹಣದುಬ್ಬರದೊಂದಿಗೂ ಹೋಲಿಸುತ್ತಾರೆ."
    response_type: glossary
    status: draft
  glossary.inflation.brief:
    text: "ಕಾಲಕ್ರಮೇಣ ಬೆಲೆಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಏರುವುದು; ಅದೇ ರೂಪಾಯಿಗಳ ಖರೀದಿ ಶಕ್ತಿ ಕಡಿಮೆಯಾಗುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.emergency_fund.title:
    text: "ತುರ್ತು ನಿಧಿ"
    response_type: glossary
    status: draft
  glossary.emergency_fund.body:
    text: "ತುರ್ತು ನಿಧಿ ಎಂದರೆ ವೈದ್ಯಕೀಯ ಬಿಲ್ ಅಥವಾ ಆದಾಯ ನಿಲ್ಲುವಂತಹ ಹಠಾತ್ ಅಗತ್ಯಗಳಿಗಾಗಿ ಪಕ್ಕಕ್ಕಿಟ್ಟ ಮೊತ್ತ. ಇದನ್ನು ಹೂಡಿಕೆಗೆಂದಿರುವ ಹಣದಿಂದ ಬೇರೆ ಇಡಲಾಗುತ್ತದೆ; ಆಗ ಹೂಡಿಕೆಯನ್ನು ಅವಸರದಲ್ಲಿ ಮಾರಬೇಕಾಗುವುದಿಲ್ಲ. ಎಷ್ಟು ಇಡಬೇಕು ಎಂಬುದು ನಿಮ್ಮದೇ ನಿರ್ಧಾರ; Ruko ಅದನ್ನು ನಿಗದಿಪಡಿಸುವುದಿಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.emergency_fund.brief:
    text: "ವೈದ್ಯಕೀಯ ಬಿಲ್ ಅಥವಾ ಕೆಲಸ ಹೋಗುವಂತಹ ಹಠಾತ್ ಅಗತ್ಯಗಳಿಗಾಗಿ ಪಕ್ಕಕ್ಕಿಟ್ಟ ಹಣ; ಹೂಡಿಕೆಯ ಹಣದಿಂದ ಬೇರೆ."
    response_type: glossary
    status: draft
  glossary.kyc.title:
    text: "KYC (ನೋ ಯುವರ್ ಕಸ್ಟಮರ್)"
    response_type: glossary
    status: draft
  glossary.kyc.body:
    text: "KYC ಎಂದರೆ ನೋ ಯುವರ್ ಕಸ್ಟಮರ್. ಹೂಡಿಕೆ ಮಾಡುವ ಮುನ್ನ ಅಥವಾ ಡಿಮ್ಯಾಟ್ ಅಥವಾ ಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ಖಾತೆ ತೆರೆಯುವ ಮುನ್ನ ದಾಖಲೆಗಳ ಮೂಲಕ ನಿಮ್ಮ ಗುರುತು ಮತ್ತು ವಿಳಾಸದ ಪರಿಶೀಲನೆಯನ್ನು ಪೂರ್ಣಗೊಳಿಸುತ್ತೀರಿ. ನೋಂದಾಯಿತ ಮಧ್ಯವರ್ತಿಗಳು ಇದನ್ನು ಕೇಳುತ್ತಾರೆ."
    response_type: glossary
    status: draft
  glossary.kyc.brief:
    text: "ನೋ ಯುವರ್ ಕಸ್ಟಮರ್: ಹೂಡಿಕೆ ಮಾಡುವ ಮುನ್ನ ಅಥವಾ ಮಾರುಕಟ್ಟೆ ಖಾತೆ ತೆರೆಯುವ ಮುನ್ನ ಬೇಕಾದ ಗುರುತು ಮತ್ತು ವಿಳಾಸದ ಪರಿಶೀಲನೆ."
    response_type: glossary
    status: draft
  glossary.sebi.title:
    text: "SEBI (ಸೆಬಿ)"
    response_type: glossary
    status: draft
  glossary.sebi.body:
    text: "SEBI ಎಂದರೆ ಭಾರತೀಯ ಸೆಕ್ಯುರಿಟೀಸ್ ಮತ್ತು ಎಕ್ಸ್‌ಚೇಂಜ್ ಬೋರ್ಡ್, ಭಾರತದ ಸೆಕ್ಯುರಿಟಿಗಳ ಮಾರುಕಟ್ಟೆಯ ನಿಯಂತ್ರಕ. ಇದು ಬ್ರೋಕರ್‌ಗಳು, ಫಂಡ್ ಹೌಸ್‌ಗಳು ಮತ್ತು ಇತರ ಮಧ್ಯವರ್ತಿಗಳಿಗೆ ನಿಯಮ ಮಾಡುತ್ತದೆ, ಹಾಗೂ ಮಾರ್ಗದರ್ಶಿಗಳು ಮತ್ತು ದೂರು ನೀಡುವ ದಾರಿ ಇರುವ ಹೂಡಿಕೆದಾರರ ವೆಬ್‌ಸೈಟ್ ನಡೆಸುತ್ತದೆ. ಮಧ್ಯವರ್ತಿ SEBI ಯಲ್ಲಿ ನೋಂದಾಯಿತರಾಗಿರುವುದು ಮತ್ತು SEBI ಅವರನ್ನು ಶಿಫಾರಸು ಮಾಡುವುದು ಒಂದೇ ಅಲ್ಲ."
    response_type: glossary
    status: draft
  glossary.sebi.brief:
    text: "ಭಾರತೀಯ ಸೆಕ್ಯುರಿಟೀಸ್ ಮತ್ತು ಎಕ್ಸ್‌ಚೇಂಜ್ ಬೋರ್ಡ್, ಭಾರತದ ಸೆಕ್ಯುರಿಟಿಗಳ ಮಾರುಕಟ್ಟೆಯ ನಿಯಂತ್ರಕ."
    response_type: glossary
    status: draft
