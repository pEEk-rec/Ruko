    response_type: glossary
    status: draft
  glossary.intraday.body:
    text: "ಇಂಟ್ರಾಡೇ ಟ್ರೇಡಿಂಗ್ ಎಂದರೆ ಒಂದೇ ವಹಿವಾಟಿನ ದಿನದಲ್ಲಿ ಖರೀದಿ ಮತ್ತು ಮಾರಾಟ, ಅಂದರೆ ಮಾರುಕಟ್ಟೆ ಮುಚ್ಚುವ ಮೊದಲು ಸ್ಥಾನ ಮುಚ್ಚಲಾಗುತ್ತದೆ."
    response_type: glossary
    status: draft
  glossary.demat.title:
    text: "ಡಿಮ್ಯಾಟ್ ಖಾತೆ"
    response_type: glossary
    status: draft
  glossary.demat.body:
    text: "ಡಿಮ್ಯಾಟ್ ಖಾತೆಯಲ್ಲಿ ನಿಮ್ಮ ಷೇರುಗಳು ಮತ್ತು ಇತರ ಸೆಕ್ಯುರಿಟಿಗಳು ಎಲೆಕ್ಟ್ರಾನಿಕ್ ರೂಪದಲ್ಲಿ ಇರುತ್ತವೆ. ಇದನ್ನು SEBI ಯಲ್ಲಿ ನೋಂದಾಯಿತ ಡಿಪಾಸಿಟರಿ ಪಾರ್ಟಿಸಿಪೆಂಟ್ ಮೂಲಕ ತೆರೆಯಲಾಗುತ್ತದೆ."
    response_type: glossary
    status: draft
