    status: draft
  card.loss_beyond_margin.title:
    text: "ನಷ್ಟ ನೀವು ಹಾಕಿದ್ದಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಬಹುದು"
    response_type: card
    status: draft
  card.loss_beyond_margin.body:
    text: "ಡೆರಿವೇಟಿವ್‌ಗಳ ಬಗ್ಗೆ SEBI ಯ ಅಪಾಯ ಮಾಹಿತಿ ಹೇಳುವಂತೆ, ಬೆಲೆಗಳು ನಿಮ್ಮ ವಿರುದ್ಧ ಹೋದರೆ ನಿಮ್ಮ ಮಾರ್ಜಿನ್‌ನ ಸ್ವಲ್ಪ ಅಥವಾ ಪೂರ್ಣ ಭಾಗ ಹೋಗಬಹುದು, ಮತ್ತು ನಷ್ಟ ನೀವು ಹಾಕಿದ ಮಾರ್ಜಿನ್‌ಗಿಂತ ಹೆಚ್ಚಾಗಬಹುದು."
