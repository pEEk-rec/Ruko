    status: draft
  lesson.shares_basics.summary:
    text: "ಷೇರು ಕಂಪನಿಯ ಒಂದು ಸಣ್ಣ ಭಾಗ, ಅದರ ಬೆಲೆ ಪ್ರತಿದಿನ ಬದಲಾಗುತ್ತದೆ."
    response_type: lesson
    status: draft
  lesson.shares_basics.body:
    text: "ಷೇರು, ಸ್ಟಾಕ್ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ, ಕಂಪನಿಯ ಮಾಲೀಕತ್ವದ ಒಂದು ಸಣ್ಣ ಭಾಗ. ಪಟ್ಟಿಯಾದ ಕಂಪನಿಯ ಷೇರುಗಳು ನಿಮ್ಮ ಬಳಿ ಇದ್ದರೆ, ಅದರ ಒಂದು ಸಣ್ಣ ತುಣುಕಿನ ಮಾಲೀಕರು ನೀವು.\n\nಪಟ್ಟಿಯಾದ ಷೇರುಗಳನ್ನು ಸ್ಟಾಕ್ ಎಕ್ಸ್‌ಚೇಂಜ್‌ನಲ್ಲಿ ಖರೀದಿ-ಮಾರಾಟ ಮಾಡಲಾಗುತ್ತದೆ. ಖರೀದಿದಾರ-ಮಾರಾಟಗಾರರು ಹೊಸ ಬೆಲೆಗೆ ಒಪ್ಪಿದಂತೆ ಬೆಲೆ ಬದಲಾಗುತ್ತದೆ; ಅದು ಏರಬಹುದು ಅಥವಾ ಇಳಿಯಬಹುದು, ಕೆಲವೊಮ್ಮೆ ವೇಗವಾಗಿ. ಅದು ಯಾವ ಕಡೆ ಹೋಗುತ್ತದೆ ಎಂದು ಯಾರೂ ಮೊದಲೇ ತಿಳಿಯಲಾರರು.\n\nಷೇರು ಹೊಂದಿದರೆ ಯಾವ ಭರವಸೆಯೂ ಇಲ್ಲ: ಲಾಭವೂ ಇಲ್ಲ, ಕನಿಷ್ಠ ಬೆಲೆಯೂ ಇಲ್ಲ. ನಿಮ್ಮ ಷೇರುಗಳು ಡಿಮ್ಯಾಟ್ ಖಾತೆಯಲ್ಲಿ ಎಲೆಕ್ಟ್ರಾನಿಕ್ ರೂಪದಲ್ಲಿ ಇರುತ್ತವೆ. ಅವುಗಳಲ್ಲಿ ನಿಮ್ಮದೇ ಎಷ್ಟು ಹಣ ಇದೆ ಎಂಬುದನ್ನು ನೀವು ತಿಳಿಯಬಹುದು, ಅದನ್ನು ನೋಡಲು Ruko ಸಹಾಯ ಮಾಡಬಲ್ಲದು."
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.title:
    text: "ಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ"
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.summary:
    text: "ಹಲವರ ಹಣ, ಒಬ್ಬ ಫಂಡ್ ಮ್ಯಾನೇಜರ್, ಮತ್ತು NAV ಯಿಂದ ಬೆಲೆ ನಿರ್ಧಾರವಾಗುವ ಯೂನಿಟ್‌ಗಳು."
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.body:
    text: "ಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ಹಲವರ ಹಣವನ್ನು ಸೇರಿಸಿ ಷೇರು, ಬಾಂಡ್ ಅಥವಾ ಎರಡರಲ್ಲೂ ಹೂಡುತ್ತದೆ. ಫಂಡ್ ಮ್ಯಾನೇಜರ್ ಆ ಆಯ್ಕೆಗಳನ್ನು ಮಾಡುತ್ತಾರೆ, ಪ್ರತಿಯೊಬ್ಬರೂ ಫಂಡ್‌ನ ಯೂನಿಟ್‌ಗಳ ಮಾಲೀಕರಾಗುತ್ತಾರೆ.\n\nಒಂದು ಯೂನಿಟ್‌ನ ಬೆಲೆ ಫಂಡ್‌ನ NAV; ಫಂಡ್ ಹೊಂದಿರುವುದರಿಂದ ಅದನ್ನು ಲೆಕ್ಕ ಹಾಕಲಾಗುತ್ತದೆ. ಹೆಚ್ಚು ಅಥವಾ ಕಡಿಮೆ NAV ಮಾತ್ರದಿಂದ ಫಂಡ್ ಉತ್ತಮ ಅಥವಾ ಕೆಟ್ಟದೆಂದು ಆಗುವುದಿಲ್ಲ. ಫಂಡ್ ವಾರ್ಷಿಕ ವೆಚ್ಚವನ್ನೂ ವಿಧಿಸುತ್ತದೆ, ಅದನ್ನು ಎಕ್ಸ್ಪೆನ್ಸ್ ರೇಷಿಯೋ ಎನ್ನುತ್ತಾರೆ; ಅದು ಫಂಡ್‌ನ ಮೌಲ್ಯದಿಂದಲೇ ಕಡಿತವಾಗುತ್ತದೆ.\n\nSIP ಯೂನಿಟ್ ಖರೀದಿಸುವ ಒಂದು ವಿಧಾನ: ನಿಯಮಿತ ಅಂತರದಲ್ಲಿ ನಿಗದಿತ ಮೊತ್ತ. ಷೇರುಗಳನ್ನು ಹೊಂದಿರುವ ಫಂಡ್‌ಗಳು ಮಾರುಕಟ್ಟೆಯೊಂದಿಗೆ ಏರಿಳಿಯುತ್ತವೆ; ಅವುಗಳ ಮೌಲ್ಯ ಇಳಿಯಲೂಬಹುದು, ಏರಲೂಬಹುದು."
    response_type: lesson
    status: draft
  lesson.forwarded_tips.title:
    text: "ಫಾರ್ವರ್ಡ್ ಆದ ಟಿಪ್ ಏಕೆ ತುರ್ತು ಅನಿಸುತ್ತದೆ"
    response_type: lesson
    status: draft
  lesson.forwarded_tips.summary:
    text: "ಅವಸರ, ಗುಟ್ಟು ಮತ್ತು ಗುಂಪು ನೀವು ಯೋಚಿಸುವ ಮುನ್ನವೇ ನಿರ್ಧಾರಕ್ಕೆ ತಳ್ಳಬಹುದು."
    response_type: lesson
    status: draft
  lesson.forwarded_tips.body:
    text: "ಗುಂಪಿನಲ್ಲಿ ಅಥವಾ ಸ್ನೇಹಿತರಿಂದ ಬರುವ ಟಿಪ್‌ಗಳು ಹೆಚ್ಚಾಗಿ ಒಂದು ತಳ್ಳುವಿಕೆಯೊಂದಿಗೆ ಬರುತ್ತವೆ: ಇಂದೇ ಮಾಡಿ, ಕೆಲವೇ ಸ್ಥಾನ ಉಳಿದಿವೆ, ಗುಂಪಿನ ಎಲ್ಲರೂ ಸೇರಿದ್ದಾರೆ. ಅವಸರ, ಗುಟ್ಟು ಮತ್ತು ಗುಂಪು ಜನರು ಯೋಚಿಸುವ ಮುನ್ನವೇ ನಿರ್ಧರಿಸುವಂತೆ ಮಾಡುವ ಸಾಮಾನ್ಯ ವಿಧಾನಗಳು.\n\nಕಳುಹಿಸಿದವರನ್ನು ನಂಬುವುದು ಸಹಜ. ಆದರೂ ಆ ನಂಬಿಕೆ ಈ ನಿರ್ಧಾರ ನಿಮ್ಮದೇ ಹಣ, ನಿಯಮಗಳು ಮತ್ತು ಯೋಜನೆಗೆ ಏನು ಅರ್ಥ ಎಂದು ಹೇಳುವುದಿಲ್ಲ.\n\nಸ್ವಲ್ಪ ನಿಲ್ಲುವುದಕ್ಕೆ ಹೆಚ್ಚು ಖರ್ಚಿಲ್ಲ. ಅದರಲ್ಲಿ ಮೂರು ಪ್ರಶ್ನೆ ಕೇಳಬಹುದು: ಇದರಲ್ಲಿ ನನ್ನದೇ ಎಷ್ಟು ಹಣ, ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, ಮತ್ತು ನಾನು ಯಾವಾಗ ಹೊರಬರುತ್ತೇನೆ. ಟಿಪ್ ಒಳ್ಳೆಯದೇ ಎಂದು Ruko ಹೇಳಲಾರದು; ಆ ಪ್ರಶ್ನೆ ಕೇಳಲು ಸಹಾಯ ಮಾಡಬಲ್ಲದು."
    response_type: lesson
    status: draft
  lesson.decision_plan.title:
    text: "ಕ್ರಮಕ್ಕೆ ಮುನ್ನ ಬರೆದ ಯೋಜನೆ"
    response_type: lesson
    status: draft
  lesson.decision_plan.summary:
    text: "ಶಾಂತವಾಗಿದ್ದಾಗ ಬರೆದ ಮೂರು ಸಾಲು: ಏಕೆ, ಎಷ್ಟು, ಮತ್ತು ಯಾವಾಗ ಹಿಂದೆ ಸರಿಯುತ್ತೀರಿ."
    response_type: lesson
    status: draft
  lesson.decision_plan.body:
    text: "ಯೋಜನೆ ಎಂದರೆ ಹಣ ಹಾಕುವ ಮುನ್ನ ಶಾಂತವಾಗಿದ್ದಾಗ ಬರೆಯುವ ಕೆಲವು ಸಾಲುಗಳು. ಮೂರು ಸಾಕು: ನಾನು ಇದನ್ನು ಏಕೆ ಮಾಡುತ್ತಿದ್ದೇನೆ, ಎಷ್ಟು ಹಾಕುತ್ತಿದ್ದೇನೆ, ಮತ್ತು ಯಾವುದರಿಂದ ನಾನು ಮರುಯೋಚಿಸುತ್ತೇನೆ ಅಥವಾ ಹೊರಬರುತ್ತೇನೆ.\n\nಬೆಲೆಗಳು ಮತ್ತು ಸಂದೇಶಗಳು ಕೆಲವೇ ನಿಮಿಷಗಳಲ್ಲಿ ನಿಮ್ಮ ಭಾವನೆಯನ್ನು ಬದಲಿಸಬಹುದು. ಮೊದಲೇ ಬರೆದ ಯೋಜನೆ ಆ ಭಾವನೆಯನ್ನು ಹೋಲಿಸಲು ಏನನ್ನೋ ಕೊಡುತ್ತದೆ.\n\nಬೆಲೆ ನೀವು ಆರಿಸಿದ ಮಟ್ಟಕ್ಕೆ ಇಳಿದಾಗ ಮಾರುವ ಸ್ಟಾಪ್ ಲಾಸ್, ಹೊರಬರುವ ಸಾಲನ್ನು ಬರೆಯುವ ಒಂದು ವಿಧಾನ. ಯೋಜನೆ ನಿರ್ಧಾರವನ್ನು ಸರಿ ಮಾಡುವುದಿಲ್ಲ; ಅದು ನಿರ್ಧಾರವನ್ನು ನಿಮ್ಮದಾಗಿಸುತ್ತದೆ. Ruko ದಲ್ಲಿ ವಿರಾಮ ಯೋಜನೆ ಕೇಳಿದಾಗ ನೀವು ಯೋಜನೆ ಬರೆಯಬಹುದು, ಅದು ನಿಮ್ಮ ಫೋನ್‌ನಲ್ಲೇ ಇರುತ್ತದೆ."
    response_type: lesson
    status: draft
  lesson.emergency_money.title:
    text: "ಬೇಗ ಬೇಕಾಗಬಹುದಾದ ಹಣ"
    response_type: lesson
    status: draft
  lesson.emergency_money.summary:
    text: "ಹಠಾತ್ ಅಗತ್ಯಗಳ ಹಣವನ್ನು ಹೂಡಿಕೆಯ ಹಣದಿಂದ ಏಕೆ ಬೇರೆ ಇಡಲಾಗುತ್ತದೆ."
    response_type: lesson
    status: draft
  lesson.emergency_money.body:
    text: "ಕೆಲವು ಹಣಕ್ಕೆ ಬೇಗನೆ ಒಂದು ಕೆಲಸ ಇರುತ್ತದೆ: ಬಾಡಿಗೆ, ಶಾಲಾ ಶುಲ್ಕ, ವೈದ್ಯಕೀಯ ಬಿಲ್, ಆದಾಯವಿಲ್ಲದ ಒಂದು ತಿಂಗಳು. ಅದೇ ತುರ್ತು ನಿಧಿ, ಮತ್ತು ಅದು ವರ್ಷಗಳ ಕಾಲ ಬಿಡಬಹುದಾದ ಹಣಕ್ಕಿಂತ ಬೇರೆ.\n\nಎರಡೂ ಬೆರೆತಾಗ, ಬಿಲ್ ಬರುವ ಹೊತ್ತಿಗೇ ಬೆಲೆ ಇಳಿಯಬಹುದು, ಆಗ ಅವಸರದಲ್ಲಿ ಮಾರಬೇಕಾಗಬಹುದು. ಸಾಲದ ಹಣ ಎರಡನೇ ಒತ್ತಡ ಸೇರಿಸುತ್ತದೆ, ಏಕೆಂದರೆ ಹೂಡಿಕೆಗೆ ಏನೇ ಆದರೂ ಸಾಲ ತೀರಿಸಲೇಬೇಕು.\n\nಎಷ್ಟು ಪಕ್ಕಕ್ಕಿಡಬೇಕು ಎಂಬುದು ನಿಮ್ಮ ನಿರ್ಧಾರ, ಅದು ನಿಮ್ಮ ಜೀವನವನ್ನು ಅವಲಂಬಿಸಿದೆ. Ruko ಅದನ್ನು ನಿಗದಿಪಡಿಸುವುದಿಲ್ಲ. ನೀವು ಕೊಟ್ಟ ಅಂಕಿಗಳು ಮತ್ತು ನಿಯಮಗಳ ಎದುರು ಒಂದು ನಿರ್ಧಾರದ ಅರ್ಥ ಏನು ಎಂದು ಅದು ತೋರಿಸಬಲ್ಲದು."
    response_type: lesson
    status: draft
  lesson.diversification.title:
    text: "ಎಲ್ಲವೂ ಒಂದೇ ಕಡೆ ಅಲ್ಲ"
    response_type: lesson
    status: draft
  lesson.diversification.summary:
    text: "ಒಂದು ಫಲಿತಾಂಶ ಎಲ್ಲವನ್ನೂ ನಿರ್ಧರಿಸದಂತೆ ಹಣವನ್ನು ಹಂಚುವುದು."
    response_type: lesson
    status: draft
  lesson.diversification.body:
    text: "ವೈವಿಧ್ಯೀಕರಣ ಎಂದರೆ ನಿಮ್ಮ ಹಣವನ್ನು ಬೇರೆ ಬೇರೆ ಕಡೆ ಹಂಚುವುದು; ಒಂದು ನಿರಾಶಾದಾಯಕ ಫಲಿತಾಂಶ ಎಲ್ಲವನ್ನೂ ನಿರ್ಧರಿಸದಿರಲಿ ಎಂದು. ಎಲ್ಲವನ್ನೂ ಒಂದು ಷೇರು, ಒಂದು ಟಿಪ್ ಅಥವಾ ಒಂದು ಆಪ್‌ಗೆ ಹಾಕಿದರೆ ನಿಮ್ಮ ಸಂಪೂರ್ಣ ಫಲಿತಾಂಶ ಆ ಒಂದರ ಮೇಲೆ ನಿಲ್ಲುತ್ತದೆ.\n\nಹಂಚುವುದರಿಂದ ಆ ಅವಲಂಬನೆ ಕಡಿಮೆಯಾಗುತ್ತದೆ. ಅಪಾಯ ಹೋಗುವುದಿಲ್ಲ, ನಷ್ಟವಾಗುವುದಿಲ್ಲ ಎಂಬ ಭರವಸೆಯೂ ಇಲ್ಲ: ಹಲವು ವಸ್ತುಗಳ ಬೆಲೆ ಒಟ್ಟಿಗೇ ಇಳಿಯಬಹುದು.\n\nಮ್ಯೂಚುಯಲ್ ಫಂಡ್ ಈಗಾಗಲೇ ಹಲವು ಷೇರು ಅಥವಾ ಬಾಂಡ್‌ಗಳನ್ನು ಹೊಂದಿರುತ್ತದೆ; ಅದು ಹಂಚುವ ಒಂದು ವಿಧಾನ. ಟಿಪ್ ನಿಮ್ಮ ಹಣದ ದೊಡ್ಡ ಭಾಗವನ್ನು ಒಂದೇ ವಸ್ತುವಿಗೆ ಕೇಳಿದಾಗ, ಸ್ವಲ್ಪ ನಿಲ್ಲುವುದು ಯೋಗ್ಯ. ಒಂದು ನಿರ್ಧಾರ ನಿಮ್ಮದೇ ಹಣದ ಎಷ್ಟು ಭಾಗ ಎಂದು Ruko ತೋರಿಸಬಲ್ಲದು."
    response_type: lesson
    status: draft
  lesson.compounding_time.title:
    text: "ಸಮಯ ಮತ್ತು ಚಕ್ರಬಡ್ಡಿ"
    response_type: lesson
    status: draft
  lesson.compounding_time.summary:
    text: "ಬೆಳವಣಿಗೆ ಹಿಂದಿನ ಬೆಳವಣಿಗೆಯ ಮೇಲೆ ಹೇಗೆ ಕಟ್ಟಲ್ಪಡಬಹುದು, ಮತ್ತು ವರ್ಷಗಳ ಸಂಖ್ಯೆ ಏಕೆ ಮುಖ್ಯ."
    response_type: lesson
    status: draft
  lesson.compounding_time.body:
    text: "ಚಕ್ರಬಡ್ಡಿ ಎಂದರೆ ನಿಮ್ಮ ಗಳಿಕೆ ನಿಮ್ಮ ಹಣಕ್ಕೆ ಸೇರಿ ತಾನೂ ಗಳಿಸುವುದು; ಬೆಳವಣಿಗೆ ಹಿಂದಿನ ಬೆಳವಣಿಗೆಯ ಮೇಲೆ ಕಟ್ಟಲ್ಪಡುತ್ತದೆ. ಇದನ್ನು ಎರಡು ವಿಷಯಗಳು ನಡೆಸುತ್ತವೆ: ಹಣ ಎಷ್ಟು ಕಾಲ ಇರುತ್ತದೆ, ಮತ್ತು ದರ, ಅದನ್ನು ಮೊದಲೇ ಯಾರೂ ತಿಳಿಯಲಾರರು.\n\nಅದಕ್ಕಾಗಿಯೇ Ruko ದ SIP ಕ್ಯಾಲ್ಕುಲೇಟರ್ ಹಲವು ಉದಾಹರಣೆ ದರಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ತೋರಿಸುತ್ತದೆ. ಅವು ನೀವು ಆರಿಸಿದ ದರಗಳ ಲೆಕ್ಕ, ಮುನ್ಸೂಚನೆಗಳಲ್ಲ. ತಿಂಗಳು ಮತ್ತು ದರಗಳನ್ನು ಬದಲಿಸಿ ಒಟ್ಟು ಮೊತ್ತ ಹೇಗೆ ಬದಲಾಗುತ್ತದೆ ನೋಡಿ.\n\nಹಣದುಬ್ಬರ ವಿರುದ್ಧ ದಿಕ್ಕಿನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ: ಬೆಲೆಗಳು ಏರುತ್ತಾ ಹೋದರೆ ಅದೇ ರೂಪಾಯಿಗಳಿಂದ ಕೊಳ್ಳಬಹುದಾದದ್ದು ಕಡಿಮೆಯಾಗುತ್ತದೆ. ಲೆಕ್ಕ ಪರಿಶೀಲಿಸಲು ಬಯಸಿದರೆ SEBI ಯ ಹೂಡಿಕೆದಾರರ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲೂ ಕ್ಯಾಲ್ಕುಲೇಟರ್‌ಗಳಿವೆ."
    response_type: lesson
    status: draft

