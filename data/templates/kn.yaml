# Kannada templates. Draft translations: need review by a native speaker.
locale: kn
name: ಕನ್ನಡ

templates:
  refusal.advice_request.message:
    text: "ಏನನ್ನು ಕೊಳ್ಳಬೇಕು, ಮಾರಬೇಕು ಅಥವಾ ಇಟ್ಟುಕೊಳ್ಳಬೇಕು ಎಂದು Ruko ಯಾರಿಗೂ ಹೇಳುವುದಿಲ್ಲ. ಆ ನಿರ್ಧಾರ ಯಾವಾಗಲೂ ನಿಮ್ಮದೇ."
    response_type: refusal
    status: draft
  refusal.prediction_request.message:
    text: "ಬೆಲೆ ಅಥವಾ ಮಾರುಕಟ್ಟೆ ಎತ್ತ ಸಾಗುತ್ತದೆ ಎಂದು Ruko ಊಹಿಸುವುದಿಲ್ಲ. ಅದನ್ನು ಯಾರೂ ಖಚಿತವಾಗಿ ತಿಳಿಯಲು ಸಾಧ್ಯವಿಲ್ಲ."
    response_type: refusal
    status: draft
  refusal.instrument_evaluation.message:
    text: "Ruko ಷೇರು, ಫಂಡ್, ಐಪಿಓ ಅಥವಾ ಯೋಜನೆಗಳನ್ನು ಒಳ್ಳೆಯದು ಅಥವಾ ಕೆಟ್ಟದು ಎಂದು ಹೇಳುವುದಿಲ್ಲ, ಅವುಗಳನ್ನು ಹೋಲಿಸುವುದೂ ಇಲ್ಲ."
    response_type: refusal
    status: draft
  refusal.broker_recommendation.message:
    text: "Ruko ಯಾವುದೇ ಬ್ರೋಕರ್ ಅಥವಾ ಆ್ಯಪ್ ಅನ್ನು ಶಿಫಾರಸು ಮಾಡುವುದಿಲ್ಲ, ಹೋಲಿಸುವುದೂ ಇಲ್ಲ. ಬ್ರೋಕರ್ ನೋಂದಾಯಿತರೇ ಎಂದು SEBI ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲಿ ನೀವೇ ನೋಡಬಹುದು."
    response_type: refusal
    status: draft
  refusal.roleplay_advisor.message:
    text: "ಆಟವಾಗಿಯೂ, 'ಒಂದು ವೇಳೆ' ಎಂದರೂ Ruko ಸಲಹೆಗಾರನಂತೆ ನಟಿಸುವುದಿಲ್ಲ. ಅದು ಬೇರೆ ರೀತಿಯಲ್ಲಿ ನಿಮ್ಮ ಪರವಾಗಿ ಇರುತ್ತದೆ."
    response_type: refusal
    status: draft
  refusal.alternative:
    text: "Ruko ಮಾಡಬಹುದಾದದ್ದು: ನಿಮಗೆ ಬಂದ ಮೆಸೇಜ್ ಅನ್ನು ಹಂಚಿಕೊಳ್ಳಿ. ಈ ನಿರ್ಧಾರ ನಿಮ್ಮ ಸ್ವಂತ ಹಣ, ನಿಮ್ಮ ಸ್ವಂತ ನಿಯಮಗಳು ಮತ್ತು ನಿಮ್ಮ ನಿರ್ಗಮನ ಯೋಜನೆಗೆ ಏನು ಅರ್ಥ ಎಂದು Ruko ತೋರಿಸುತ್ತದೆ."
    response_type: refusal
    status: draft
  refusal.sensitive_data.message:
    text: "ನಿಲ್ಲಿ. ನಿಮ್ಮ ಮೆಸೇಜ್‌ನಲ್ಲಿ OTP, PIN, ಪಾಸ್‌ವರ್ಡ್ ಅಥವಾ ಕಾರ್ಡ್ ಸಂಖ್ಯೆಯಂತಹದ್ದು ಕಾಣುತ್ತಿದೆ. Ruko ಅದನ್ನು ಇಟ್ಟುಕೊಂಡಿಲ್ಲ, ಎಲ್ಲಿಗೂ ಕಳುಹಿಸಿಲ್ಲ."
    response_type: refusal
    status: draft
  refusal.sensitive_data.alternative:
    text: "ಇವುಗಳನ್ನು ಯಾರೊಂದಿಗೂ ಹಂಚಿಕೊಳ್ಳಬೇಡಿ: ಬ್ಯಾಂಕ್, ಬ್ರೋಕರ್, 'ಸಪೋರ್ಟ್' ಏಜೆಂಟ್ ಅಥವಾ Ruko, ಯಾರಿಗೂ ಬೇಡ. ಅದನ್ನು ಅಳಿಸಿ, ಮೆಸೇಜ್ ಅನ್ನು ಮತ್ತೆ ಹಂಚಿಕೊಳ್ಳಿ."
    response_type: refusal
    status: draft
