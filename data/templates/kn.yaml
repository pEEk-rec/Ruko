  glossary.nominee.body:
    text: "ನಿಮಗೆ ಏನಾದರೂ ಆದರೆ ನಿಮ್ಮ ಹೂಡಿಕೆಗಳನ್ನು ಪಡೆಯಲು ನೀವು ಹೆಸರಿಸುವ ವ್ಯಕ್ತಿಯೇ ನಾಮಿನಿ. ಸಾಮಾನ್ಯವಾಗಿ ಡಿಮ್ಯಾಟ್ ಖಾತೆ ಅಥವಾ ಮ್ಯೂಚುವಲ್ ಫಂಡ್ ಫೋಲಿಯೋದಲ್ಲಿ ನಾಮಿನಿಯನ್ನು ಸೇರಿಸಬಹುದು ಅಥವಾ ಬದಲಿಸಬಹುದು."
    response_type: glossary
    status: draft
  glossary.not_found:
