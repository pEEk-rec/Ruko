  lesson.risk_and_return.title:
    text: "Risk and return go together"
    response_type: lesson
    status: draft
  lesson.risk_and_return.summary:
    text: "Why a chance of a bigger gain usually comes with a chance of a bigger loss."
    response_type: lesson
    status: draft
  lesson.risk_and_return.body:
    text: "Every investment carries some risk: the real result can differ from what you hoped for, and that includes a loss. SEBI's guide to spotting scams says all securities market investments carry some degree of risk.\n\nIn general, things that offer the chance of a bigger gain also carry the chance of a bigger loss. So a message that promises high returns with no risk deserves a close look. Day to day, risk shows up as volatility: prices swinging up and down.\n\nRisk is not a reason to stay out, and not a reason to jump in. It is a reason to know how much of your own money a loss would touch before you decide."
    response_type: lesson
    status: draft
  lesson.shares_basics.title:
    text: "What owning a share means"
    response_type: lesson
    status: draft
  lesson.shares_basics.summary:
    text: "A share is a small part of a company, and its price moves every day."
    response_type: lesson
    status: draft
  lesson.shares_basics.body:
    text: "A share, also called a stock, is a small part of the ownership of a company. If you hold shares of a listed company, you own a tiny slice of it.\n\nListed shares are bought and sold on a stock exchange. The price changes as buyers and sellers agree on new prices, so it can rise or fall, sometimes quickly. Nobody can know in advance which way it will go.\n\nOwning a share promises nothing: no return and no minimum price. Your shares are held in a demat account in electronic form. What you can know is how much of your own money is in them, and Ruko can help you look at that."
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.title:
    text: "How a mutual fund works"
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.summary:
    text: "Many people's money, one fund manager, and units priced by NAV."
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.body:
    text: "A mutual fund collects money from many people and invests it in shares, bonds or both. A fund manager makes those choices, and each person owns units of the fund.\n\nThe price of one unit is the fund's NAV, worked out from what the fund holds. A higher or lower NAV on its own does not make a fund better or worse. The fund also charges a yearly cost, the expense ratio, which is taken out of the fund's value.\n\nA SIP is one way to buy units: a fixed amount at regular intervals. Funds that hold shares go up and down with the market, so their value can fall as well as rise."
    response_type: lesson
    status: draft
  lesson.forwarded_tips.title:
    text: "Why a forwarded tip feels urgent"
    response_type: lesson
    status: draft
  lesson.forwarded_tips.summary:
    text: "Hurry, secrecy and a crowd can push a decision before you have thought it through."
    response_type: lesson
    status: draft
  lesson.forwarded_tips.body:
    text: "Tips that arrive in a group or from a friend often come with a push: act today, only a few places left, everyone in the group is in. Hurry, secrecy and a crowd are common ways to get people to decide before they have thought.\n\nTrusting the person who sent it is natural. That trust still does not tell you what the decision means for your own money, rules and plan.\n\nA short pause costs very little. In it you can ask three things: how much of my own money is this, where would it come from, and when would I get out. Ruko cannot say whether a tip is good; it can help you ask them."
    response_type: lesson
    status: draft
  lesson.decision_plan.title:
    text: "A plan you write before you act"
    response_type: lesson
    status: draft
  lesson.decision_plan.summary:
    text: "Three lines written while calm: why, how much, and when you would step back."
    response_type: lesson
    status: draft
  lesson.decision_plan.body:
    text: "A plan is a few lines you write while calm, before money moves. Three are enough: why am I doing this, how much am I putting in, and what would make me reconsider or get out.\n\nPrices and messages can change how you feel within minutes. A plan written earlier gives you something to compare that feeling with.\n\nA stop-loss, which sells when a price falls to a level you pick, is one way to write the get-out line. A plan does not make a decision right; it makes the decision yours. In Ruko you can write a plan when a pause asks for one, and it stays on your phone."
    response_type: lesson
    status: draft
  lesson.emergency_money.title:
    text: "Money you may need soon"
    response_type: lesson
    status: draft
  lesson.emergency_money.summary:
    text: "Why money for sudden needs is kept apart from money for investing."
    response_type: lesson
    status: draft
  lesson.emergency_money.body:
    text: "Some money has a job to do soon: rent, school fees, a medical bill, a month without income. That is emergency money, and it is different from money you can leave alone for years.\n\nWhen the two are mixed, a fall in prices can arrive at the same time as a bill, and selling investments in a hurry can become the only way to pay it. Borrowed money adds a second pressure, because the loan has to be repaid whatever happens to the investment.\n\nHow much to keep aside is your decision, and it depends on your life. Ruko does not set it. It can show what a decision would mean against the figures and rules you gave it."
    response_type: lesson
    status: draft
  lesson.diversification.title:
    text: "Not everything in one place"
    response_type: lesson
    status: draft
  lesson.diversification.summary:
    text: "Spreading money out so one result does not decide everything."
    response_type: lesson
    status: draft
  lesson.diversification.body:
    text: "Diversification means spreading your money across different things, so that one disappointing result does not decide everything. Putting all of it into one share, one tip or one app makes your whole outcome depend on that one thing.\n\nSpreading out reduces that dependence. It does not remove risk, and it cannot promise that you will not lose: the prices of many things can fall together.\n\nA mutual fund already holds many shares or bonds, which is one way people spread out. When a tip asks for a large part of your money in a single thing, that is worth a pause. Ruko can show what share of your own money a decision would be."
    response_type: lesson
    status: draft
  lesson.compounding_time.title:
    text: "Time and compounding"
    response_type: lesson
    status: draft
  lesson.compounding_time.summary:
    text: "How growth can build on earlier growth, and why the number of years matters."
    response_type: lesson
    status: draft
  lesson.compounding_time.body:
    text: "Compounding is when what you earn is added to your money and then earns too, so growth builds on earlier growth. Two things drive it: how long the money stays, and the rate, which nobody can know in advance.\n\nThat is why Ruko's SIP calculator shows several example rates side by side. They are arithmetic under rates you choose, not forecasts. Try changing the months and the rates and watch how the totals move.\n\nInflation works in the other direction: prices rise over time, so the same rupees buy less. SEBI's investor website also has calculators if you want to check the arithmetic."
    response_type: lesson
    status: draft

