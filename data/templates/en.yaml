    status: draft
  glossary.expense_ratio.title:
    text: "Expense ratio"
    response_type: glossary
    status: draft
  glossary.expense_ratio.body:
    text: "The expense ratio is the yearly cost of running a mutual fund, shown as a percentage of the money in it. It is taken out of the fund's value, so you do not pay it as a separate bill, but it does reduce what the fund earns for you."
    response_type: glossary
    status: draft
  glossary.expense_ratio.brief:
    text: "The yearly fee a mutual fund charges, as a percentage of the money in the fund."
    response_type: glossary
    status: draft
  glossary.stock.title:
    text: "Share (stock)"
    response_type: glossary
    status: draft
  glossary.stock.body:
    text: "A share, also called a stock, is a small part of the ownership of a company. Shares of listed companies are bought and sold on a stock exchange, and the price moves as buyers and sellers agree on new prices. Owning a share does not promise any return."
    response_type: glossary
    status: draft
  glossary.stock.brief:
    text: "A small part-ownership of a company. Its price on the exchange moves as buyers and sellers agree on new prices."
    response_type: glossary
    status: draft
  glossary.stop_loss.title:
    text: "Stop-loss"
    response_type: glossary
    status: draft
  glossary.stop_loss.body:
    text: "A stop-loss is an instruction to sell if a price falls to a level you pick, so that a loss does not keep growing. Once the level is reached, the sale happens at the price available then, which can be different from the level you picked, especially when prices move fast."
    response_type: glossary
    status: draft
  glossary.stop_loss.brief:
    text: "An instruction to sell if the price falls to a level you pick. The sale may happen at a different price than the one you picked."
    response_type: glossary
    status: draft
  glossary.volatility.title:
    text: "Volatility"
    response_type: glossary
    status: draft
  glossary.volatility.body:
    text: "Volatility describes how much and how quickly a price moves up and down. A very volatile price makes big swings, in both directions. It tells you about the size of the swings, not about where the price will go next."
    response_type: glossary
    status: draft
  glossary.volatility.brief:
    text: "How much and how quickly a price moves up and down. It describes the size of the swings, not which way they go."
    response_type: glossary
    status: draft
  glossary.diversification.title:
    text: "Diversification"
    response_type: glossary
    status: draft
  glossary.diversification.body:
    text: "Diversification means spreading money across different things, so that one disappointing result does not decide everything. It reduces how much you depend on any one thing, but it does not remove risk or make a loss impossible."
    response_type: glossary
    status: draft
  glossary.diversification.brief:
    text: "Spreading money across different things so that one result does not decide everything. It reduces dependence on one thing; it does not remove risk."
    response_type: glossary
    status: draft
  glossary.compounding.title:
    text: "Compounding"
    response_type: glossary
    status: draft
  glossary.compounding.body:
    text: "Compounding is when the returns on your money are added to it and then earn returns of their own, so growth builds on earlier growth. The longer money stays invested, the larger this effect becomes. It works the same way for losses, and nobody can know the returns in advance."
    response_type: glossary
    status: draft
  glossary.compounding.brief:
    text: "When what you earn is added to your money and starts earning too, so growth builds on earlier growth."
    response_type: glossary
    status: draft
