    status: draft
  recovery.step.call_1930:
    text: "Call {helpline} now, the national cybercrime helpline, and report the fraud. Keep the acknowledgement number they give you."
    response_type: recovery_step
    status: draft
  recovery.step.call_bank:
    text: "Call your bank's official helpline (the number on your card, passbook or the bank's own website), or use your UPI app's fraud-reporting option. Report the transaction and ask them to block it."
    response_type: recovery_step
    status: draft
  recovery.step.remove_app:
    text: "Uninstall the app they asked you to install. Don't share any code it shows, and don't open banking apps while it is on your phone."
