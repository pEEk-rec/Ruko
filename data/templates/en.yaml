  # --- Cards and base rates (Stage 8) ----------------------------------------------
  card.already_paid.title:
    text: "Already paid or shared details?"
    status: draft
  card.already_paid.body:
    text: "Act quickly. Open 'Already paid?' in Ruko for the official helplines and the steps to take, in order."
    status: draft
  card.pay_to_individual.title:
    text: "Who is this payment going to?"
    status: draft
  card.pay_to_individual.body:
    text: "SEBI-registered brokers and other intermediaries must use special UPI IDs ending in '@valid' plus the bank's name to collect UPI payments. A personal UPI ID, phone number or bank account shared in a chat is something else. You can check a UPI ID yourself on SEBI Check (link below)."
    status: draft
  card.no_assured_returns.title:
    text: "About promised returns"
    status: draft
  card.no_assured_returns.body:
    text: "SEBI's rules do not allow registered investment advisers to offer advice that implies assured, minimum or target returns. Prices can fall as well as rise."
    status: draft
  card.check_registration.title:
    text: "Check registration yourself"
    status: draft
  card.check_registration.body:
    text: "Anyone can write 'registered' or show a certificate. You can look up a broker, investment adviser or research analyst yourself on SEBI's list of recognised intermediaries (link below). Ruko does not check this for you."
    status: draft
  card.leverage_rupees.title:
    text: "Your amount, in rupees"
    status: draft
  card.leverage_rupees.body:
    text: "Just arithmetic, not a forecast: if the {amount} you put in falls by {pct}%, that is {loss} of your money."
    status: draft
  card.loss_beyond_margin.title:
    text: "Losses can be bigger than what you put in"
    status: draft
  card.loss_beyond_margin.body:
    text: "SEBI's risk disclosure for derivatives says that if prices move against you, you can lose part or all of your margin, and the loss can be more than the margin you put in."
    status: draft
  card.group_base_rate.title:
    text: "What a SEBI study found for a group"
    status: draft
  card.costs_frequent_derivative.title:
    text: "Costs add up with every trade"
    status: draft
  card.costs_frequent_derivative.body:
    text: "In SEBI's study for {year}, trading costs were {pct}% of the gross losses of individual F&O traders who lost money. More trades mean more costs, whatever the outcome."
    status: draft
  card.costs_intraday.title:
    text: "Costs add up with every trade"
    status: draft
  card.costs_intraday.body:
    text: "In SEBI's study for {year}, trading costs added {pct}% to the losses of individual intraday traders who lost money. More trades mean more costs, whatever the outcome."
    status: draft
  card.capital_gains_holding_period.title:
    text: "Tax depends on how long you hold"
    status: draft
  card.capital_gains_holding_period.body:
    text: "For listed shares and equity mutual funds (STT paid), gains on holdings sold within {months} months are taxed at {stcg}%; after that, at {ltcg}% on gains above {exempt} a year. Rules for sales from {as_of}. Your own tax depends on your situation."
    status: draft
  base_rate.eds_loss_makers:
