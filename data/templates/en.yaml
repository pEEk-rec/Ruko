    status: draft
  recovery.evidence.dates:
    text: "Dates and times of each message and payment"
    status: draft
  recovery.evidence.links_and_apps:
    text: "Links you were sent and the names of any apps you installed"
    status: draft
  recovery.evidence.contract_notes:
    text: "Contract notes for the trades in question"
    status: draft
  recovery.evidence.account_statements:
    text: "Your trading and demat account statements"
    status: draft
  recovery.evidence.broker_messages:
    text: "Emails, SMS or app messages from the broker"
    status: draft
  recovery.evidence.complaint_numbers:
    text: "Complaint or ticket numbers you have received"
    status: draft
  recovery.draft.fraud:
    text: "Subject: Complaint about a financial fraud. I want to report a financial fraud. On [date], I was contacted through [group, app or website name] and asked to pay. I paid [amount] by [UPI, bank transfer or card] to [UPI ID or account, as in the screenshot]. Transaction ID: [transaction ID]. 1930 acknowledgement number: [if any]. I attach screenshots of the messages and payments. Please register my complaint and help block the transaction."
    status: draft
  recovery.draft.broker:
    text: "Subject: Complaint about [an unauthorised trade or a service issue] in my account. I hold a trading or demat account with [broker or DP name], client ID [your client ID]. On [date], [describe what happened]. Please look into this and resolve it, and share a complaint reference number. I attach [contract notes, statements or messages]."
