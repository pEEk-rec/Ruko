    text: "A way to apply for an IPO where the money stays in your bank account, blocked until shares are allotted."
    response_type: glossary
    status: draft
  glossary.mutual_fund.title:
    text: "Mutual fund"
    response_type: glossary
    status: draft
  glossary.mutual_fund.body:
    text: "A mutual fund collects money from many people and invests it in shares, bonds or both. A fund manager makes the choices, and you own units of the fund, so you share in whatever the fund earns or loses. Units are priced by the fund's NAV."
    response_type: glossary
    status: draft
  glossary.mutual_fund.brief:
    text: "A pool of many people's money, run by a fund manager, that holds shares, bonds or both. You own units of the pool."
