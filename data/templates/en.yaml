  glossary.inflation.body:
    text: "Inflation is the general rise in prices over time. When prices rise, the same rupees buy less than before, so money sitting idle slowly loses buying power. That is why returns are often compared with inflation, not only with the rupees put in."
    response_type: glossary
    status: draft
  glossary.inflation.brief:
