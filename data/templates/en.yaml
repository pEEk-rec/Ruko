    status: draft
  glossary.asba.body:
    text: "ASBA stands for Application Supported by Blocked Amount. When you apply for an IPO this way, the money stays in your own bank account but is blocked until shares are allotted. It is taken only for the shares you are allotted, and nothing has to be refunded if you get none."
