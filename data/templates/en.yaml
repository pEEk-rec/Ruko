  # --- Recovery path (Stage 9) ---------------------------------------------------------
  recovery.no_promise:
    text: "Ruko can't promise the money will come back, but acting fast gives you the best chance. Here are the official places to go, in order."
    status: draft
  recovery.step.call_1930:
    text: "Call 1930 now, the national cybercrime helpline, and report the fraud. Keep the acknowledgement number they give you."
    status: draft
  recovery.step.call_bank:
    text: "Call your bank's official helpline (the number on your card, passbook or the bank's own website), or use your UPI app's fraud-reporting option. Report the transaction and ask them to block it."
    status: draft
  recovery.step.remove_app:
    text: "Uninstall the app they asked you to install. Don't share any code it shows, and don't open banking apps while it is on your phone."
    status: draft
  recovery.step.stop_paying:
    text: "Don't pay anything more: not a fee, a tax or a deposit to 'unlock' or withdraw money."
    status: draft
  recovery.step.report_portal:
    text: "File a complaint on the National Cyber Crime Reporting Portal (link below), or follow up there on your 1930 report."
    status: draft
  recovery.step.keep_evidence:
    text: "Keep all the evidence listed below. Don't delete chats, even if the group or person asks you to."
    status: draft
  recovery.step.contact_broker:
    text: "First, write to your broker's or depository participant's official grievance channel, and note the complaint number."
    status: draft
  recovery.step.escalate_scores:
    text: "If it is not resolved, file a complaint on SEBI SCORES (link below)."
    status: draft
  recovery.step.escalate_odr:
    text: "If you are still not satisfied, you can use the SMART ODR portal for online conciliation and arbitration (link below)."
    status: draft
  recovery.evidence.screenshots:
    text: "Screenshots of the messages, the group or profile, and the payment screens"
    status: draft
  recovery.evidence.transaction_ids:
    text: "Transaction IDs or UTR numbers of every payment"
    status: draft
  recovery.evidence.payee_details:
