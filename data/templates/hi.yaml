  lesson.risk_and_return.title:
    text: "जोखिम और रिटर्न साथ चलते हैं"
    response_type: lesson
    status: draft
  lesson.risk_and_return.summary:
    text: "बड़े फ़ायदे की संभावना के साथ आम तौर पर बड़े नुकसान की संभावना क्यों आती है।"
    response_type: lesson
    status: draft
  lesson.risk_and_return.body:
    text: "हर निवेश में कुछ जोखिम होता है: असली नतीजा आपकी उम्मीद से अलग हो सकता है, और इसमें नुकसान भी शामिल है। SEBI की धोखाधड़ी पहचानने वाली गाइड कहती है कि प्रतिभूति बाज़ार के हर निवेश में कुछ न कुछ जोखिम होता है।\n\nआम तौर पर जिन चीज़ों में बड़े फ़ायदे की संभावना होती है, उनमें बड़े नुकसान की संभावना भी होती है। इसलिए बिना जोखिम ऊँचे रिटर्न का वादा करने वाले संदेश को ध्यान से देखना चाहिए। रोज़मर्रा में जोखिम अस्थिरता के रूप में दिखता है: कीमतों का ऊपर-नीचे होना।\n\nजोखिम न बाहर रहने की वजह है, न कूद पड़ने की। यह फ़ैसले से पहले यह जानने की वजह है कि नुकसान आपके अपने कितने पैसे को छुएगा।"
    response_type: lesson
    status: draft
  lesson.shares_basics.title:
    text: "शेयर रखने का मतलब"
    response_type: lesson
    status: draft
  lesson.shares_basics.summary:
    text: "शेयर किसी कंपनी का छोटा हिस्सा है, और इसकी कीमत रोज़ बदलती है।"
    response_type: lesson
    status: draft
  lesson.shares_basics.body:
    text: "शेयर, जिसे स्टॉक भी कहते हैं, किसी कंपनी की मिल्कियत का एक छोटा हिस्सा है। अगर आपके पास किसी सूचीबद्ध कंपनी के शेयर हैं, तो आप उसके एक छोटे से हिस्से के मालिक हैं।\n\nसूचीबद्ध शेयर स्टॉक एक्सचेंज पर खरीदे-बेचे जाते हैं। खरीदार और विक्रेता नई कीमत पर सहमत होते हैं तो कीमत बदलती है, इसलिए यह बढ़ या घट सकती है, कभी-कभी तेज़ी से। कोई पहले से नहीं जान सकता कि यह किस ओर जाएगी।\n\nशेयर रखने से किसी चीज़ का वादा नहीं मिलता: न रिटर्न, न कम से कम कीमत। आपके शेयर डीमैट खाते में इलेक्ट्रॉनिक रूप में रखे जाते हैं। आप यह जान सकते हैं कि उनमें आपका अपना कितना पैसा है, और Ruko इसे देखने में मदद कर सकता है।"
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.title:
    text: "म्यूचुअल फंड कैसे काम करता है"
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.summary:
    text: "बहुत से लोगों का पैसा, एक फंड मैनेजर, और NAV से तय होने वाली यूनिट।"
    response_type: lesson
    status: draft
  lesson.mutual_funds_basics.body:
    text: "म्यूचुअल फंड बहुत से लोगों का पैसा इकट्ठा करके शेयर, बॉन्ड या दोनों में लगाता है। फंड मैनेजर ये चुनाव करता है, और हर व्यक्ति फंड की यूनिट का मालिक होता है।\n\nएक यूनिट की कीमत फंड का NAV है, जो फंड के पास रखी चीज़ों से निकाला जाता है। सिर्फ़ ऊँचा या नीचा NAV किसी फंड को बेहतर या बदतर नहीं बनाता। फंड एक सालाना खर्च भी लेता है, जिसे एक्सपेंस रेशियो कहते हैं, और यह फंड की कीमत में से कटता है।\n\nSIP यूनिट खरीदने का एक तरीका है: नियमित अंतराल पर तय रकम। शेयर रखने वाले फंड बाज़ार के साथ ऊपर-नीचे होते हैं, इसलिए उनकी कीमत घट भी सकती है और बढ़ भी सकती है।"
    response_type: lesson
    status: draft
  lesson.forwarded_tips.title:
    text: "फ़ॉरवर्ड की गई टिप जल्दी क्यों लगती है"
    response_type: lesson
    status: draft
  lesson.forwarded_tips.summary:
    text: "जल्दबाज़ी, राज़ और भीड़ आपको सोचने से पहले फ़ैसले की ओर धकेल सकते हैं।"
    response_type: lesson
    status: draft
  lesson.forwarded_tips.body:
    text: "ग्रुप में या किसी दोस्त से आई टिप अक्सर एक धक्के के साथ आती है: आज ही करें, कुछ ही जगह बची हैं, ग्रुप में सब शामिल हैं। जल्दबाज़ी, राज़ और भीड़ लोगों से सोचने से पहले फ़ैसला करवाने के आम तरीके हैं।\n\nभेजने वाले पर भरोसा करना स्वाभाविक है। फिर भी वह भरोसा यह नहीं बताता कि यह फ़ैसला आपके अपने पैसे, नियमों और योजना के लिए क्या मायने रखता है।\n\nथोड़ा रुकने में बहुत कम खर्च होता है। उसमें आप तीन बातें पूछ सकते हैं: इसमें मेरा अपना कितना पैसा है, यह कहाँ से आएगा, और मैं कब बाहर निकलूँगा। Ruko यह नहीं बता सकता कि टिप अच्छी है या नहीं; यह आपको ये सवाल पूछने में मदद कर सकता है।"
    response_type: lesson
    status: draft
  lesson.decision_plan.title:
    text: "कदम उठाने से पहले लिखी योजना"
    response_type: lesson
    status: draft
  lesson.decision_plan.summary:
    text: "शांत मन से लिखी तीन पंक्तियाँ: क्यों, कितना, और कब आप पीछे हटेंगे।"
    response_type: lesson
    status: draft
  lesson.decision_plan.body:
    text: "योजना कुछ पंक्तियाँ हैं जो आप शांत मन से, पैसा लगाने से पहले लिखते हैं। तीन काफ़ी हैं: मैं यह क्यों कर रहा हूँ, कितना लगा रहा हूँ, और किस बात पर मैं दोबारा सोचूँगा या बाहर निकलूँगा।\n\nकीमतें और संदेश कुछ ही मिनटों में आपकी भावना बदल सकते हैं। पहले लिखी योजना उस भावना से तुलना करने के लिए कुछ देती है।\n\nस्टॉप लॉस, जो कीमत आपके चुने स्तर तक गिरने पर बेच देता है, बाहर निकलने वाली पंक्ति लिखने का एक तरीका है। योजना फ़ैसले को सही नहीं बनाती; वह फ़ैसले को आपका बनाती है। Ruko में जब कोई ठहराव योजना माँगे, आप योजना लिख सकते हैं, और वह आपके फ़ोन पर ही रहती है।"
    response_type: lesson
    status: draft
  lesson.emergency_money.title:
    text: "वह पैसा जिसकी जल्द ज़रूरत पड़ सकती है"
    response_type: lesson
    status: draft
  lesson.emergency_money.summary:
    text: "अचानक ज़रूरतों का पैसा निवेश के पैसे से अलग क्यों रखा जाता है।"
    response_type: lesson
    status: draft
  lesson.emergency_money.body:
    text: "कुछ पैसे को जल्द कोई काम करना होता है: किराया, स्कूल फ़ीस, इलाज का बिल, बिना आमदनी का एक महीना। यही आपातकालीन निधि है, और यह उस पैसे से अलग है जिसे आप सालों तक छोड़ सकते हैं।\n\nजब दोनों मिल जाते हैं, तो कीमतों में गिरावट उसी समय आ सकती है जब कोई बिल आए, और आपको जल्दबाज़ी में बेचना पड़ सकता है। उधार का पैसा दूसरा दबाव जोड़ता है, क्योंकि निवेश का जो भी हो, कर्ज़ चुकाना ही पड़ता है।\n\nकितना अलग रखना है, यह आपका फ़ैसला है और आपकी ज़िंदगी पर निर्भर है। Ruko इसे तय नहीं करता। यह दिखा सकता है कि आपके दिए आँकड़ों और नियमों के मुकाबले किसी फ़ैसले का क्या मतलब होगा।"
    response_type: lesson
    status: draft
  lesson.diversification.title:
    text: "सब कुछ एक जगह नहीं"
    response_type: lesson
    status: draft
  lesson.diversification.summary:
    text: "पैसा बाँटना ताकि एक नतीजा सब कुछ तय न करे।"
    response_type: lesson
    status: draft
  lesson.diversification.body:
    text: "विविधीकरण का मतलब है अपना पैसा अलग-अलग चीज़ों में बाँटना, ताकि एक निराशाजनक नतीजा सब कुछ तय न कर दे। सारा पैसा एक शेयर, एक टिप या एक ऐप में लगाने से आपका पूरा नतीजा उसी एक चीज़ पर टिक जाता है।\n\nबाँटने से वह निर्भरता घटती है। इससे जोखिम खत्म नहीं होता, और यह वादा नहीं कि आपको नुकसान नहीं होगा: कई चीज़ों की कीमतें एक साथ गिर सकती हैं।\n\nम्यूचुअल फंड पहले से कई शेयर या बॉन्ड रखता है, जो बाँटने का एक तरीका है। जब कोई टिप आपके पैसे का बड़ा हिस्सा एक ही चीज़ में माँगे, तो रुककर सोचना ठीक है। Ruko दिखा सकता है कि कोई फ़ैसला आपके अपने पैसे का कितना हिस्सा होगा।"
    response_type: lesson
    status: draft
  lesson.compounding_time.title:
    text: "समय और चक्रवृद्धि"
    response_type: lesson
    status: draft
  lesson.compounding_time.summary:
    text: "बढ़त पिछली बढ़त पर कैसे बन सकती है, और सालों की गिनती क्यों मायने रखती है।"
    response_type: lesson
    status: draft
  lesson.compounding_time.body:
    text: "चक्रवृद्धि तब होती है जब आपकी कमाई आपके पैसे में जुड़कर खुद भी कमाने लगती है, यानी बढ़त पिछली बढ़त पर बनती है। इसे दो चीज़ें चलाती हैं: पैसा कितने समय तक रहता है, और दर, जिसे पहले से कोई नहीं जान सकता।\n\nइसीलिए Ruko का SIP कैलकुलेटर कई उदाहरण दरें साथ-साथ दिखाता है। ये आपकी चुनी दरों पर गणित हैं, अनुमान नहीं। महीने और दरें बदलकर देखिए कि कुल रकम कैसे बदलती है।\n\nमहंगाई उल्टी दिशा में काम करती है: समय के साथ कीमतें बढ़ती हैं, इसलिए उतने ही रुपयों में कम आता है। अगर आप गणित जाँचना चाहें, तो SEBI की निवेशक वेबसाइट पर भी कैलकुलेटर हैं।"
