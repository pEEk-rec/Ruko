  lesson.never_pay_to_withdraw.body:
    text: "SEBI की नकली ट्रेडिंग ऐप वाली गाइड में एक चरण 'निकासी रुकी' बताया गया है: पैसे निकालने की कोशिश पर बहाने और फीस सामने आती हैं। अगर कोई आपसे अपना ही पैसा निकालने से पहले किसी व्यक्ति को फीस, टैक्स या 'डिपॉज़िट' भेजने को कहे, तो आप आगे कोई भी भुगतान करने से पहले रुक सकते हैं। स्क्रीनशॉट और भुगतान की जानकारी सँभालकर रखें। Ruko के 'पैसे दे चुका हूँ' वाले चरण बताते हैं कि शिकायत कहाँ करनी है। फैसला आपका है।"
    response_type: lesson
    status: draft
  lesson.guaranteed_returns.title:
    text: "वादा किए गए रिटर्न क्यों मायने रखते हैं"
