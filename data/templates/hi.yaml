    text: "आईपीओ (इनिशियल पब्लिक ऑफ़रिंग)"
    response_type: glossary
    status: draft
  glossary.ipo.body:
    text: "आईपीओ तब होता है जब कोई कंपनी पहली बार आम लोगों को अपने शेयर बेचती है। लोग एक तय समय में आवेदन करते हैं; समय खत्म होने के बाद शेयर अलॉट होते हैं और फिर स्टॉक एक्सचेंज पर उनका कारोबार शुरू होता है। आवेदन करने का मतलब यह नहीं कि शेयर मिलेंगे ही।"
    response_type: glossary
    status: draft
  glossary.fno.title:
    text: "F&O (फ़्यूचर्स और ऑप्शंस)"
    response_type: glossary
    status: draft
  glossary.fno.body:
    text: "फ़्यूचर्स और ऑप्शंस ऐसे कॉन्ट्रैक्ट हैं जिनकी कीमत किसी और चीज़, जैसे शेयर या इंडेक्स, पर निर्भर करती है। इनमें मार्जिन से ट्रेड होता है, इसलिए भाव की छोटी चाल भी लगाए गए पैसों की तुलना में रुपयों में बड़ा फ़र्क ला सकती है।"
    response_type: glossary
    status: draft
  glossary.margin.title:
    text: "मार्जिन"
    response_type: glossary
    status: draft
  glossary.margin.body:
    text: "मार्जिन वह रकम है जो ब्रोकर आपसे रखवाता है ताकि आप उस रकम से बड़ी पोज़िशन ले सकें। फ़ायदा और नुकसान पूरी पोज़िशन पर गिना जाता है, सिर्फ़ मार्जिन पर नहीं।"
    response_type: glossary
    status: draft
  glossary.sip.title:
    text: "SIP (सिस्टमैटिक इन्वेस्टमेंट प्लान)"
    response_type: glossary
    status: draft
  glossary.sip.body:
    text: "SIP में एक साथ पैसा लगाने के बजाय, तय अंतराल पर, जैसे हर महीने, म्यूचुअल फ़ंड में एक तय रकम लगती है।"
    response_type: glossary
    status: draft
  glossary.nav.title:
    text: "NAV (नेट एसेट वैल्यू)"
    response_type: glossary
    status: draft
  glossary.nav.body:
    text: "NAV म्यूचुअल फ़ंड की एक यूनिट की कीमत है, जो फ़ंड के पास मौजूद चीज़ों से निकाली जाती है। सिर्फ़ ज़्यादा या कम NAV से यह पता नहीं चलता कि फ़ंड बेहतर है या खराब।"
    response_type: glossary
    status: draft
  glossary.intraday.title:
    text: "इंट्राडे ट्रेडिंग"
    response_type: glossary
    status: draft
  glossary.intraday.body:
    text: "इंट्राडे ट्रेडिंग का मतलब है एक ही कारोबारी दिन में खरीदना और बेचना, यानी बाज़ार बंद होने से पहले पोज़िशन बंद हो जाती है।"
    response_type: glossary
    status: draft
  glossary.demat.title:
    text: "डीमैट खाता"
    response_type: glossary
    status: draft
  glossary.demat.body:
    text: "डीमैट खाते में आपके शेयर और दूसरी सिक्योरिटीज़ इलेक्ट्रॉनिक रूप में रहती हैं। यह SEBI में रजिस्टर्ड डिपॉज़िटरी पार्टिसिपेंट के ज़रिए खुलता है।"
    response_type: glossary
    status: draft
