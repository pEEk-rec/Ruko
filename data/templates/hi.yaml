  # --- Learn list: glossary briefs, new terms, evergreen lessons ---
  glossary.ipo.brief:
    text: "किसी कंपनी की जनता को शेयर बेचने की पहली बिक्री। आप एक तय अवधि में आवेदन करते हैं; आवेदन शेयर मिलने का वादा नहीं है।"
    response_type: glossary
    status: draft
  glossary.fno.brief:
    text: "ऐसे कॉन्ट्रैक्ट जिनकी कीमत किसी शेयर या इंडेक्स पर निर्भर करती है। कीमत में छोटी हलचल भी लगाए गए पैसे के मुकाबले आपके रुपयों में बड़ा फर्क ला सकती है।"
    response_type: glossary
    status: draft
  glossary.margin.brief:
    text: "वह पैसा जो आप ब्रोकर के पास रखते हैं ताकि उस पैसे से बड़ी पोज़ीशन ले सकें। लाभ और हानि पूरी पोज़ीशन पर गिने जाते हैं।"
    response_type: glossary
    status: draft
  glossary.sip.brief:
    text: "म्यूचुअल फ़ंड में एक साथ नहीं, बल्कि हर महीने जैसे नियमित अंतराल पर तय रकम लगाना।"
    response_type: glossary
    status: draft
  glossary.nav.brief:
    text: "म्यूचुअल फ़ंड की एक यूनिट की कीमत। सिर्फ़ ऊँचा या नीचा NAV किसी फ़ंड को बेहतर या बदतर नहीं बनाता।"
    response_type: glossary
    status: draft
  glossary.intraday.brief:
    text: "एक ही ट्रेडिंग दिन में खरीदना और बेचना, यानी कुछ भी रात भर नहीं रखा जाता।"
    response_type: glossary
    status: draft
  glossary.demat.brief:
    text: "वह खाता जिसमें आपके शेयर और अन्य प्रतिभूतियाँ इलेक्ट्रॉनिक रूप में रखी जाती हैं।"
    response_type: glossary
    status: draft
  glossary.nominee.brief:
    text: "वह व्यक्ति जिसे आप नामित करते हैं ताकि आपको कुछ होने पर आपके निवेश उसे मिलें।"
    response_type: glossary
    status: draft
  glossary.asba.title:
    text: "ASBA"
    response_type: glossary
    status: draft
  glossary.asba.body:
    text: "ASBA का मतलब है Application Supported by Blocked Amount। इस तरीके से IPO के लिए आवेदन करने पर पैसा आपके अपने बैंक खाते में ही रहता है, पर शेयर आवंटित होने तक रोक दिया जाता है। वह सिर्फ़ उन शेयरों के लिए कटता है जो आपको मिलते हैं, और कुछ न मिले तो कुछ लौटाने की ज़रूरत नहीं पड़ती।"
    response_type: glossary
    status: draft
  glossary.asba.brief:
    text: "IPO के लिए आवेदन का तरीका जिसमें पैसा आपके बैंक खाते में रहता है और शेयर आवंटित होने तक रोका जाता है।"
    response_type: glossary
    status: draft
  glossary.mutual_fund.title:
    text: "म्यूचुअल फंड"
    response_type: glossary
    status: draft
  glossary.mutual_fund.body:
    text: "म्यूचुअल फंड बहुत से लोगों का पैसा इकट्ठा करके शेयर, बॉन्ड या दोनों में लगाता है। फंड मैनेजर चुनाव करता है, और आप फंड की यूनिट के मालिक होते हैं, इसलिए फंड जो कमाए या गँवाए, उसमें आपका हिस्सा होता है। यूनिट की कीमत फंड के NAV से तय होती है।"
    response_type: glossary
    status: draft
  glossary.mutual_fund.brief:
    text: "बहुत से लोगों के पैसे का एक पूल, जिसे फंड मैनेजर चलाता है और जो शेयर, बॉन्ड या दोनों रखता है। आप उस पूल की यूनिट के मालिक होते हैं।"
    response_type: glossary
    status: draft
  glossary.expense_ratio.title:
    text: "एक्सपेंस रेशियो"
    response_type: glossary
    status: draft
  glossary.expense_ratio.body:
    text: "एक्सपेंस रेशियो म्यूचुअल फंड चलाने का सालाना खर्च है, जो फंड में लगे पैसे के प्रतिशत के रूप में दिखाया जाता है। यह फंड की कीमत में से कटता है, इसलिए आपको अलग बिल नहीं भरना पड़ता, पर यह फंड से आपकी कमाई घटाता है।"
    response_type: glossary
    status: draft
  glossary.expense_ratio.brief:
    text: "म्यूचुअल फंड का सालाना शुल्क, जो फंड में लगे पैसे के प्रतिशत के रूप में लिया जाता है।"
    response_type: glossary
    status: draft
  glossary.stock.title:
    text: "शेयर (स्टॉक)"
    response_type: glossary
    status: draft
  glossary.stock.body:
    text: "शेयर, जिसे स्टॉक भी कहते हैं, किसी कंपनी की मिल्कियत का एक छोटा हिस्सा है। सूचीबद्ध कंपनियों के शेयर स्टॉक एक्सचेंज पर खरीदे-बेचे जाते हैं, और खरीदार-विक्रेता नई कीमत पर सहमत होते हैं तो कीमत बदलती है। शेयर रखने से किसी रिटर्न का वादा नहीं मिलता।"
    response_type: glossary
    status: draft
  glossary.stock.brief:
    text: "किसी कंपनी की मिल्कियत का एक छोटा हिस्सा। एक्सचेंज पर इसकी कीमत तब बदलती है जब खरीदार और विक्रेता नई कीमत पर सहमत होते हैं।"
    response_type: glossary
    status: draft
  glossary.stop_loss.title:
    text: "स्टॉप लॉस"
    response_type: glossary
    status: draft
  glossary.stop_loss.body:
    text: "स्टॉप लॉस एक निर्देश है जिसमें कीमत आपके चुने स्तर तक गिरने पर बिक्री अपने-आप हो जाती है, ताकि नुकसान बढ़ता न जाए। स्तर आने पर बिक्री उस समय उपलब्ध कीमत पर होती है, जो आपके चुने स्तर से अलग हो सकती है, खासकर जब कीमतें तेज़ी से बदल रही हों।"
    response_type: glossary
    status: draft
  glossary.stop_loss.brief:
    text: "कीमत आपके चुने स्तर तक गिरने पर बेचने का निर्देश। बिक्री आपके चुने भाव से अलग भाव पर हो सकती है।"
    response_type: glossary
    status: draft
  glossary.volatility.title:
    text: "अस्थिरता (वोलैटिलिटी)"
    response_type: glossary
    status: draft
  glossary.volatility.body:
    text: "अस्थिरता बताती है कि कीमत कितनी और कितनी तेज़ी से ऊपर-नीचे होती है। बहुत अस्थिर कीमत दोनों दिशाओं में बड़े झटके देती है। यह झटकों के आकार के बारे में बताती है, इस बारे में नहीं कि कीमत आगे कहाँ जाएगी।"
    response_type: glossary
    status: draft
  glossary.volatility.brief:
    text: "कीमत कितनी और कितनी तेज़ी से ऊपर-नीचे होती है। यह झटकों का आकार बताती है, दिशा नहीं।"
    response_type: glossary
    status: draft
  glossary.diversification.title:
    text: "विविधीकरण"
    response_type: glossary
    status: draft
  glossary.diversification.body:
    text: "विविधीकरण का मतलब है पैसे को अलग-अलग चीज़ों में बाँटना, ताकि एक निराशाजनक नतीजा सब कुछ तय न कर दे। इससे किसी एक चीज़ पर आपकी निर्भरता घटती है, पर जोखिम खत्म नहीं होता और नुकसान असंभव नहीं हो जाता।"
    response_type: glossary
    status: draft
  glossary.diversification.brief:
    text: "पैसे को अलग-अलग चीज़ों में बाँटना ताकि एक नतीजा सब कुछ तय न करे। इससे एक चीज़ पर निर्भरता घटती है, जोखिम खत्म नहीं होता।"
    response_type: glossary
    status: draft
  glossary.compounding.title:
    text: "चक्रवृद्धि (कंपाउंडिंग)"
    response_type: glossary
    status: draft
  glossary.compounding.body:
    text: "चक्रवृद्धि तब होती है जब आपके पैसे पर मिला रिटर्न उसी में जुड़ता है और फिर खुद रिटर्न कमाता है, यानी बढ़त पिछली बढ़त पर बनती है। पैसा जितना लंबा टिकता है, यह असर उतना बड़ा होता है। नुकसान पर भी यह इसी तरह काम करता है, और रिटर्न पहले से कोई नहीं जान सकता।"
    response_type: glossary
    status: draft
  glossary.compounding.brief:
    text: "जब आपकी कमाई आपके पैसे में जुड़कर खुद भी कमाने लगती है, यानी बढ़त पिछली बढ़त पर बनती है।"
    response_type: glossary
    status: draft
  glossary.inflation.title:
    text: "महंगाई (मुद्रास्फीति)"
    response_type: glossary
    status: draft
  glossary.inflation.body:
    text: "महंगाई समय के साथ कीमतों का आम तौर पर बढ़ना है। कीमतें बढ़ती हैं तो उतने ही रुपयों में पहले से कम चीज़ें आती हैं, इसलिए बेकार पड़ा पैसा धीरे-धीरे अपनी खरीदने की ताकत खोता है। इसी वजह से रिटर्न की तुलना अक्सर सिर्फ़ लगाए रुपयों से नहीं, महंगाई से भी की जाती है।"
    response_type: glossary
    status: draft
  glossary.inflation.brief:
    text: "समय के साथ कीमतों का आम तौर पर बढ़ना, जिससे उतने ही रुपयों में पहले से कम चीज़ें आती हैं।"
    response_type: glossary
    status: draft
  glossary.emergency_fund.title:
    text: "आपातकालीन निधि"
    response_type: glossary
    status: draft
  glossary.emergency_fund.body:
    text: "आपातकालीन निधि वह रकम है जो अचानक ज़रूरतों, जैसे इलाज के बिल या आमदनी रुकने, के लिए अलग रखी जाती है। इसे निवेश के पैसे से अलग रखा जाता है, ताकि निवेश जल्दबाज़ी में न बेचना पड़े। कितना रखना है, यह आपका अपना फ़ैसला है; Ruko यह तय नहीं करता।"
    response_type: glossary
    status: draft
  glossary.emergency_fund.brief:
    text: "अचानक ज़रूरतों, जैसे इलाज के बिल या नौकरी जाने, के लिए अलग रखा पैसा, जो निवेश के पैसे से अलग होता है।"
    response_type: glossary
    status: draft
  glossary.kyc.title:
    text: "KYC (नो योर कस्टमर)"
    response_type: glossary
    status: draft
  glossary.kyc.body:
    text: "KYC का मतलब है नो योर कस्टमर। निवेश करने या डीमैट या म्यूचुअल फंड खाता खोलने से पहले आप दस्तावेज़ों से अपनी पहचान और पते की जाँच पूरी करते हैं। पंजीकृत मध्यस्थ इसे माँगते हैं।"
    response_type: glossary
    status: draft
  glossary.kyc.brief:
    text: "नो योर कस्टमर: निवेश करने या बाज़ार खाता खोलने से पहले पहचान और पते की ज़रूरी जाँच।"
    response_type: glossary
    status: draft
  glossary.sebi.title:
    text: "SEBI (सेबी)"
    response_type: glossary
    status: draft
  glossary.sebi.body:
    text: "SEBI भारतीय प्रतिभूति और विनिमय बोर्ड है, जो भारत के प्रतिभूति बाज़ार का नियामक है। यह ब्रोकर, फंड हाउस और अन्य मध्यस्थों के लिए नियम बनाता है, और निवेशकों के लिए गाइड और शिकायत का रास्ता देने वाली वेबसाइट चलाता है। किसी मध्यस्थ का SEBI में पंजीकृत होना और SEBI का उसकी सिफ़ारिश करना एक बात नहीं है।"
    response_type: glossary
    status: draft
  glossary.sebi.brief:
    text: "भारतीय प्रतिभूति और विनिमय बोर्ड, भारत के प्रतिभूति बाज़ार का नियामक।"
    response_type: glossary
    status: draft
