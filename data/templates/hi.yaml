    response_type: group_statistic
    status: draft

  # नुकसान के बाद मदद (Stage 9)
  recovery.no_promise:
    text: "Ruko यह वादा नहीं कर सकता कि पैसे वापस आएँगे, लेकिन जल्दी कदम उठाने से सबसे अच्छा मौका मिलता है। ये सरकारी जगहें हैं, क्रम से।"
    response_type: recovery_step
    status: draft
  recovery.step.call_1930:
    text: "अभी {helpline} पर कॉल करें, यह राष्ट्रीय साइबर अपराध हेल्पलाइन है, और धोखाधड़ी की शिकायत करें। जो पावती नंबर मिले उसे संभालकर रखें।"
    response_type: recovery_step
    status: draft
  recovery.step.call_bank:
    text: "अपने बैंक की आधिकारिक हेल्पलाइन पर कॉल करें (नंबर आपके कार्ड, पासबुक या बैंक की अपनी वेबसाइट पर है), या अपने UPI ऐप में धोखाधड़ी की शिकायत वाला विकल्प इस्तेमाल करें। लेन-देन की जानकारी दें और उसे रोकने को कहें।"
    response_type: recovery_step
