    response_type: card
    status: draft
  card.loss_beyond_margin.body:
    text: "डेरिवेटिव्स के लिए SEBI की जोखिम जानकारी कहती है कि भाव आपके ख़िलाफ़ जाएँ तो आपका कुछ या पूरा मार्जिन जा सकता है, और नुकसान लगाए गए मार्जिन से ज़्यादा भी हो सकता है।"
    response_type: card
    status: draft
  card.group_base_rate.title:
    text: "SEBI के एक अध्ययन में एक समूह के बारे में क्या मिला"
    response_type: card
    status: draft
  card.costs_frequent_derivative.title:
