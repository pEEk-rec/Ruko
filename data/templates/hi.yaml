    text: "{year} के SEBI अध्ययन में, नुकसान उठाने वाले व्यक्तिगत F&O ट्रेडरों के कुल नुकसान का {pct}% ट्रेडिंग खर्च था। नतीजा कुछ भी हो, ज़्यादा ट्रेड मतलब ज़्यादा खर्च।"
    response_type: card
    status: draft
  card.costs_intraday.title:
    text: "हर ट्रेड के साथ खर्च जुड़ता है"
    response_type: card
    status: draft
  card.costs_intraday.body:
    text: "{year} के SEBI अध्ययन में, ट्रेडिंग खर्च ने नुकसान उठाने वाले व्यक्तिगत इंट्राडे ट्रेडरों का नुकसान {pct}% बढ़ा दिया। नतीजा कुछ भी हो, ज़्यादा ट्रेड मतलब ज़्यादा खर्च।"
    response_type: card
    status: draft
  card.capital_gains_holding_period.title:
