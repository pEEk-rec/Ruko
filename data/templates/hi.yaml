  base_rate.group.age_40_50:
    text: "यह आँकड़ा 40 से 50 साल के ट्रेडरों का है।"
    response_type: group_statistic
    status: draft
  base_rate.group.age_50_60:
    text: "यह आँकड़ा 50 से 60 साल के ट्रेडरों का है।"
    response_type: group_statistic
    status: draft
  base_rate.group.age_gt_60:
    text: "यह आँकड़ा 60 साल से ज़्यादा उम्र के ट्रेडरों का है।"
    response_type: group_statistic
