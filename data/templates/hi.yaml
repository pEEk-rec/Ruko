  # कार्ड और समूह आँकड़े (Stage 8)
  card.already_paid.title:
    text: "पैसे भेज दिए या जानकारी दे दी?"
    response_type: card
    status: draft
  card.already_paid.body:
    text: "जल्दी कदम उठाएँ। Ruko में 'पैसे भेज दिए?' खोलें: वहाँ सरकारी हेल्पलाइन और क्रम से करने वाले कदम हैं।"
    response_type: card
    status: draft
  card.pay_to_individual.title:
    text: "यह पैसा किसके पास जा रहा है?"
    response_type: card
    status: draft
  card.pay_to_individual.body:
    text: "SEBI में रजिस्टर्ड ब्रोकर और दूसरे मध्यस्थों को UPI से पैसे लेने के लिए खास UPI ID इस्तेमाल करनी होती है, जो '@valid' और बैंक के नाम पर खत्म होती है। चैट में भेजी गई किसी व्यक्ति की UPI ID, फ़ोन नंबर या बैंक खाता अलग बात है। कोई UPI ID आप खुद SEBI Check पर देख सकते हैं (लिंक नीचे है)।"
    response_type: card
    status: draft
  card.no_assured_returns.title:
    text: "वादा किए गए रिटर्न के बारे में"
