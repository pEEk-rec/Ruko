    response_type: card
    status: draft
  card.capital_gains_holding_period.body:
    text: "लिस्टेड शेयर और इक्विटी म्यूचुअल फ़ंड (STT चुकाया हुआ) {months} महीने के अंदर बेचने पर फ़ायदे पर {stcg}% टैक्स लगता है; उसके बाद, साल में {exempt} से ऊपर के फ़ायदे पर {ltcg}%। ये नियम {as_of} से हुई बिक्री के लिए हैं। आपका अपना टैक्स आपकी स्थिति पर निर्भर है।"
