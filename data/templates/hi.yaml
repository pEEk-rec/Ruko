  base_rate.caveat_descriptive:
    text: "SEBI कहता है कि उसका अध्ययन बताता है कि क्या हुआ, कारण और नतीजे का संबंध नहीं दिखाता। यह एक समूह के बारे में है, आपके बारे में भविष्यवाणी नहीं।"
