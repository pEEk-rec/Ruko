    text: "नॉमिनी"
    response_type: glossary
    status: draft
  glossary.nominee.body:
    text: "नॉमिनी वह व्यक्ति है जिसे आप चुनते हैं ताकि आपको कुछ होने पर आपके निवेश उसे मिलें। आम तौर पर आप डीमैट खाते या म्यूचुअल फ़ंड फ़ोलियो में नॉमिनी जोड़ या बदल सकते हैं।"
    response_type: glossary
    status: draft
