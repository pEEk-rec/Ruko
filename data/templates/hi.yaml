    status: draft
  lesson.guaranteed_returns.body:
    text: "SEBI की स्कैम पहचानने वाली गाइड कहती है कि जो भी पक्के या लगभग पक्के रिटर्न का दावा करे, उस पर शक करें, क्योंकि सिक्योरिटीज़ बाज़ार के हर निवेश में कुछ न कुछ जोखिम होता है। SEBI की निवेशक वेबसाइट यह भी बताती है कि पंजीकृत निवेश सलाहकारों को रिटर्न की गारंटी देना मना है। जब कोई मैसेज तय या रोज़ाना रिटर्न का वादा करे, तो वादे को देखें, भेजने वाले की कहानी को नहीं। Ruko किसी टिप, ऐप या व्यक्ति की गारंटी नहीं दे सकता।"
    response_type: lesson
    status: draft
  lesson.check_registration.title:
    text: "पंजीकरण खुद जाँचना"
    response_type: lesson
    status: draft
  lesson.check_registration.body:
    text: "कोई भी लिख सकता है कि वह पंजीकृत है या प्रमाणपत्र दिखा सकता है। SEBI की गाइड कहती हैं कि केवल SEBI से मान्यता प्राप्त या पंजीकृत मध्यस्थों से ही लेन-देन करें, और किसी ऐप को एक्सचेंज की वेबसाइट या SEBI की निवेशक वेबसाइट के 'रजिस्टर्ड मोबाइल ट्रेडिंग ऐप्स' भाग में जाँचें। Ruko यह जाँच आपके लिए नहीं करता। लिंक नीचे स्रोतों में हैं, ताकि आप फैसले से पहले खुद देख सकें।"
    response_type: lesson
    status: draft
  lesson.leverage_basics.title:
    text: "लेवरेज आपके पैसे के साथ क्या करता है"
    response_type: lesson
    status: draft
  lesson.leverage_basics.body:
    text: "लेवरेज का मतलब है कि पोज़िशन आपके लगाए पैसे से बड़ी है। तब कीमत की एक तय चाल आपके अपने पैसे पर दोनों दिशाओं में ज़्यादा असर डालती है। SEBI का जोखिम प्रकटीकरण दस्तावेज़ कहता है कि डेरिवेटिव में आप लगाए गए मार्जिन का कुछ हिस्सा या पूरा खो सकते हैं, और नुकसान मूल मार्जिन से ज़्यादा भी हो सकता है। यह आकार का गणित है, कीमतों का अनुमान नहीं।"
    response_type: lesson
    status: draft
  lesson.leverage_basics.body_amount:
    text: "लेवरेज का मतलब है कि पोज़िशन आपके लगाए पैसे से बड़ी है। सिर्फ़ गणित: अगर आपके {amount} से दस गुना बड़ी पोज़िशन 10% गिरे, तो नुकसान आपके पूरे {amount} के बराबर होता है। SEBI का जोखिम प्रकटीकरण दस्तावेज़ कहता है कि डेरिवेटिव में आप मार्जिन का कुछ हिस्सा या पूरा खो सकते हैं, और नुकसान मूल मार्जिन से ज़्यादा भी हो सकता है। यह आकार के बारे में है, कीमतों के अनुमान के बारे में नहीं।"
    response_type: lesson
    status: draft
  lesson.ipo_basics.title:
    text: "IPO का आवेदन क्या होता है"
    response_type: lesson
    status: draft
  lesson.ipo_basics.body:
    text: "IPO में आप शेयरों के लिए आवेदन करते हैं, और हो सकता है आपको कोई शेयर आवंटित न हो। ASBA आवेदन में, जैसा SEBI बताता है, पैसा आपके खाते में ही रहता है पर आवंटन तक ब्लॉक रहता है; सिर्फ़ आवंटित शेयरों की रकम कटती है, और आवंटन न होने पर वापसी की ज़रूरत नहीं पड़ती। आवेदन ऑफ़र की शर्तों पर शेयर माँगना है। यह नहीं बताता कि लिस्टिंग के बाद शेयर कैसे चलते हैं।"
    response_type: lesson
    status: draft
  lesson.sip_adds_up.title:
    text: "नियमित किस्तें कैसे जुड़ती हैं"
    response_type: lesson
    status: draft
  lesson.sip_adds_up.body:
    text: "SIP में तय रकम नियमित अंतराल पर लगती है। कुल रकम दो चीज़ों से बनती है: आपने क्या लगाया, जो महीनों के साथ बढ़ता है, और उस पैसे की कीमत, जो रिटर्न पर निर्भर है और जिसे पहले से कोई नहीं जान सकता। इसीलिए कैलकुलेटर एक संख्या की जगह कई उदाहरण दरें साथ-साथ दिखाता है। गणित जाँचना चाहें तो SEBI की निवेशक वेबसाइट पर भी कैलकुलेटर हैं।"
    response_type: lesson
    status: draft
  lesson.sip_adds_up.body_amount:
    text: "SIP में तय रकम नियमित अंतराल पर लगती है, यहाँ हर महीने {amount}। कुल रकम दो चीज़ों से बनती है: आपने क्या लगाया, जो महीनों के साथ बढ़ता है, और उस पैसे की कीमत, जो रिटर्न पर निर्भर है और जिसे पहले से कोई नहीं जान सकता। इसीलिए कैलकुलेटर एक संख्या की जगह कई उदाहरण दरें साथ-साथ दिखाता है। गणित जाँचना चाहें तो SEBI की निवेशक वेबसाइट पर भी कैलकुलेटर हैं।"
    response_type: lesson
    status: draft
  lesson.selling_costs_tax.title:
    text: "बेचते समय शुल्क और टैक्स"
    response_type: lesson
    status: draft
  lesson.selling_costs_tax.body:
    text: "बेचने पर शुल्क और टैक्स लग सकते हैं, इसलिए हाथ में आने वाली रकम बिक्री मूल्य से कम हो सकती है। लिस्टेड शेयरों और इक्विटी फंड के लिए भारतीय टैक्स नियम {months} महीने से ज़्यादा की होल्डिंग को छोटी अवधि से अलग मानते हैं, और दरें अलग होती हैं। Ruko आपका टैक्स नहीं निकालता। आप पर क्या लागू होता है, यह आयकर विभाग की वेबसाइट या टैक्स विशेषज्ञ बता सकते हैं।"
    response_type: lesson
    status: draft

