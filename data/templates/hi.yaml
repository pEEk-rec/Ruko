templates:
  refusal.advice_request.message:
    text: "Ruko किसी को नहीं बताता कि क्या खरीदना, बेचना या रखना है। यह फ़ैसला हमेशा आपका है।"
    status: draft
  refusal.prediction_request.message:
    text: "Ruko यह अंदाज़ा नहीं लगाता कि भाव या बाज़ार किधर जाएगा। यह कोई पक्के तौर पर नहीं जान सकता।"
    status: draft
  refusal.instrument_evaluation.message:
    text: "Ruko शेयर, फ़ंड, आईपीओ या स्कीम को अच्छा या बुरा नहीं बताता, और उनकी तुलना भी नहीं करता।"
    status: draft
  refusal.broker_recommendation.message:
    text: "Ruko किसी ब्रोकर या ऐप की सिफ़ारिश या तुलना नहीं करता। कोई ब्रोकर रजिस्टर्ड है या नहीं, यह आप SEBI की वेबसाइट पर देख सकते हैं।"
    status: draft
  refusal.roleplay_advisor.message:
    text: "Ruko सलाहकार की भूमिका नहीं निभा सकता, खेल में या 'मान लो' में भी नहीं। यह आपका साथ दूसरे तरीके से देता है।"
    status: draft
  refusal.alternative:
    text: "Ruko यह कर सकता है: आपको जो मैसेज मिला है उसे शेयर करें, और Ruko दिखाएगा कि इस फ़ैसले का आपके अपने पैसों, आपके अपने नियमों और आपके निकलने के प्लान के लिए क्या मतलब है।"
    status: draft
  refusal.sensitive_data.message:
    text: "रुकिए। आपके मैसेज में OTP, PIN, पासवर्ड या कार्ड नंबर जैसा कुछ दिख रहा है। Ruko ने इसे न रखा है, न कहीं भेजा है।"
    status: draft
  refusal.sensitive_data.alternative:
    text: "ये चीज़ें कभी किसी के साथ शेयर न करें: न बैंक, न ब्रोकर, न किसी 'सपोर्ट' वाले से, न Ruko से। इसे हटाकर मैसेज दोबारा शेयर करें।"
    status: draft
  output.blocked_fallback:
    text: "Ruko दिखा सकता है कि इस फ़ैसले का आपके अपने पैसों और आपके अपने नियमों के लिए क्या मतलब है।"
    status: draft
  verdict.cannot_vouch:
    text: "Ruko किसी टिप, ऐप या व्यक्ति की ज़िम्मेदारी नहीं ले सकता। मैसेज में उसे ये बातें दिखीं।"
    status: draft

