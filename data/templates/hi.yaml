    status: draft
  card.no_assured_returns.body:
    text: "SEBI की निवेशक वेबसाइट के अनुसार रजिस्टर्ड निवेश सलाहकार रिटर्न की गारंटी नहीं दे सकते। भाव गिर भी सकते हैं और बढ़ भी सकते हैं।"
    response_type: card
    status: draft
  card.check_registration.title:
    text: "रजिस्ट्रेशन खुद जाँचें"
    response_type: card
    status: draft
  card.check_registration.body:
    text: "कोई भी 'रजिस्टर्ड' लिख सकता है या सर्टिफ़िकेट दिखा सकता है। किसी ब्रोकर, निवेश सलाहकार या रिसर्च एनालिस्ट को आप खुद SEBI की मान्यता प्राप्त मध्यस्थों की सूची में देख सकते हैं (लिंक नीचे है)। Ruko यह जाँच आपके लिए नहीं करता।"
    response_type: card
    status: draft
  card.leverage_rupees.title:
    text: "आपकी रकम, रुपयों में"
    response_type: card
    status: draft
  card.leverage_rupees.body:
    text: "सिर्फ़ हिसाब, कोई अनुमान नहीं: आपके लगाए {amount} अगर {pct}% घटें, तो आपके {loss} चले जाते हैं।"
