# Curated glossary for the "learn" stage (BUILD_PLAN Stage 8, v2; widened for the Learn list).
# Plain-language, general explanations only: no recommendation, no product names, no
# LLM-written text. Each entry's text lives in data/templates/{locale}.yaml as
#   glossary.<id>.title   the term's name
#   glossary.<id>.body    the full plain-language explanation (the "learn" answer)
#   glossary.<id>.brief   one or two lines, shown in the small pop-up when a person taps the
#                         word inside a lesson, card or answer
# Matching uses the alias patterns below (every language runs on every input) and also finds
# the words to make tappable inside Ruko's own texts. Unknown terms get glossary.not_found
# plus the official pointer in `fallback_fact`.
#
# `lesson` (optional): the lesson that goes deeper on the term, offered after the answer.
version: "1"

fallback_fact: "regulatory:sebi_investor_website"

terms:
  - id: ipo
    aliases: ['\b(ipo|ipos|initial public offering)\b', '(आईपीओ|ಐಪಿಓ)']
    facts: ["investor_pages:ipo_through_asba"]
    lesson: ipo_basics
