# Official help routes for the recovery path. Every route: value (what Ruko shows),
# contact (phone number or official URL, or null when it differs per bank/broker), source,
# as_of and verification status. Nothing is verified until a person on the team checks it.
# Ruko never contacts anyone on the user's behalf; it shows where to go.

routes:
  helpline_1930:
    value: "Toll-free cybercrime helpline 1930: call as soon as possible to report financial fraud and get help lodging a complaint"
    contact: "1930"
    source_title: "PIB, Ministry of Home Affairs, 12 Mar 2025: Cyber Crime Reporting Systems"
    source_url: "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2110801"
    quote: >-
      "A toll-free Helpline number '1930' has been operationalized to get assistance in lodging
      online cyber complaints." and "The 'Citizen Financial Cyber Fraud Reporting and Management
      System', under I4C, has been launched in year 2021 for immediate reporting of financial
      frauds and to stop siphoning off funds by the fraudsters."
    as_of: "2025-03-12"
    verified_by_human: true
    checked_note: "Quotes checked against the PIB release on 2026-10-04; confirmed by the team."

  cybercrime_portal:
    value: "National Cyber Crime Reporting Portal (file or follow up a complaint online)"
    contact: "https://cybercrime.gov.in"
    source_title: "National Cyber Crime Reporting Portal, Indian Cybercrime Coordination Centre, MHA"
    source_url: "https://cybercrime.gov.in"
    as_of: "2026-10-03"
    verified_by_human: true

  bank:
    value: "Your bank's official helpline or your UPI app's own fraud-reporting option, to report the transaction and ask for a block"
    contact: null   # differs per bank: use the number on the card, passbook or the bank's own website
    source_title: "RBI circular RBI/2017-18/15 DBR.No.Leg.BC.78/09.07.005/2017-18 (6 Jul 2017): Customer Protection - Limiting Liability of Customers in Unauthorised Electronic Banking Transactions"
    source_url: "https://www.rbi.org.in/Scripts/BS_CircularIndexDisplay.aspx?Id=11040"
    as_of: "2017-07-06"
    verified_by_human: true
    checked_note: >-
      Circular reference and date checked on 2026-10-04. CAUTION: the circular's zero / limited
      liability rules cover UNAUTHORISED transactions (for example reported within three working
      days). A payment the user made themselves to a scammer is usually not "unauthorised".
      Ruko must never promise a refund or zero liability; it only says to contact the bank fast.

  broker_grievance:
    value: "Your broker's or depository participant's own grievance channel (first step for a registered entity)"
    contact: null   # differs per broker: their official website or app
    source_title: "SEBI SCORES: investors shall first take up grievances with the entity concerned"
    source_url: "https://scores.sebi.gov.in"
    as_of: "2026-10-03"
    verified_by_human: true

  sebi_scores:
    value: "SEBI Complaint Redressal (SCORES) Platform, for complaints against listed companies, registered intermediaries and market infrastructure institutions (after first contacting the entity)"
    contact: "https://scores.sebi.gov.in"
    source_title: "SEBI Complaint Redressal System (SCORES)"
    source_url: "https://scores.sebi.gov.in"
    as_of: "2026-10-03"
    verified_by_human: true

  smart_odr:
    value: "SMART ODR portal for online conciliation and arbitration in securities market disputes"
    contact: "https://smartodr.in"
    source_title: "SEBI SCORES page linking the SMART ODR Portal"
    source_url: "https://scores.sebi.gov.in"
    as_of: "2026-10-03"
    verified_by_human: true
