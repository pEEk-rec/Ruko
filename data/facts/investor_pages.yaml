  source_url: "https://investor.sebi.gov.in/stock-market-guru-scams.html"
  as_of: "2026-10-04"
  verified_by_human: true

spot_any_scam:
  value: "https://investor.sebi.gov.in/spot-any-scam.html"
  description: "SEBI investor website: How to Spot a Scam (guidelines)."
  quote: >-
    "Be suspicious of anyone who guarantees that an investment will give assured/guaranteed/
    near-certain returns. All securities market related investments carry some degree of risk."
