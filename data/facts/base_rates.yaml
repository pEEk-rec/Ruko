# Group statistics shown to users. Every fact: value, source, as_of, verification status.
# Shown as GROUP statistics only, never as a prediction for the user, always with a caveat.
# verified_by_human stays false until the repo owner checks each figure against the source.

sources:
  sebi_eds_fy26:
    source_title: "SEBI Study: Profitability of Individual Traders in the Equity Derivatives Segment (FY25-FY26)"
    source_url: "https://www.sebi.gov.in/reports-and-statistics/research/aug-2026/study-profitability-of-individual-traders-in-the-equity-derivatives-segment-fy25-fy26-_103835.html"
    document_url: "https://www.sebi.gov.in/sebi_data/attachdocs/aug-2026/1787233506209.pdf"
    published: "2026-08-20"
    caveat_quote: >-
      "The analysis is descriptive and does not establish cause-and-effect relationships
      between investor characteristics, regulatory measures and trading outcomes." (p. 17)
  sebi_intraday_fy23:
    source_title: "SEBI Study: Analysis of Intraday Trading by Individuals in Equity Cash Segment"
    source_url: "https://www.sebi.gov.in/reports-and-statistics/research/jul-2024/study-analysis-of-intraday-trading-by-individuals-in-equity-cash-segment_84946.html"
    document_url: "https://www.sebi.gov.in/sebi_data/attachdocs/jul-2024/1721818140715.pdf"
    published: "2024-07-24"
    caveat_quote: null   # the study has no explicit causality statement; our generic caveat applies

facts:
  # --- Equity derivatives (F&O), FY26 -------------------------------------------
  - id: eds_fy26_loss_makers_all
    source: sebi_eds_fy26
    applies_to: {product_class: derivative, age_band: null}
    group_key: all_individuals
    value: 87.7
    unit: percent_of_individual_traders_with_net_loss
    year: FY26
    quote: '"The share of loss-making individuals declined 3.2 percentage points, to 87.7% in FY26 from 90.9% in FY25." (p. 5)'
    as_of: "2026-03-31"
    verified_by_human: false
  - id: eds_fy26_loss_makers_age_lt_30
    source: sebi_eds_fy26
    applies_to: {product_class: derivative, age_band: lt_30}
    group_key: age_lt_30
    value: 88.55
    unit: percent_of_individual_traders_with_net_loss
    year: FY26
    quote: '"In FY26, 88.55% of traders below 30 years and 88.05% of traders aged 30-40 years incurred losses." (p. 68); Table 26 (p. 69)'
    as_of: "2026-03-31"
    verified_by_human: false
  - id: eds_fy26_loss_makers_age_30_40
    source: sebi_eds_fy26
    applies_to: {product_class: derivative, age_band: "30_40"}
    group_key: age_30_40
    value: 88.05
    unit: percent_of_individual_traders_with_net_loss
    year: FY26
    quote: '"Table 26: Age-wise Trading Activity and Loss Outcomes (FY26), row 30-40: Loss Makers 88.05%" (p. 69)'
    as_of: "2026-03-31"
    verified_by_human: false
  - id: eds_fy26_loss_makers_age_40_50
    source: sebi_eds_fy26
    applies_to: {product_class: derivative, age_band: "40_50"}
    group_key: age_40_50
    value: 87.80
    unit: percent_of_individual_traders_with_net_loss
    year: FY26
    quote: '"Table 26, row 40-50: Loss Makers 87.80%" (p. 69)'
    as_of: "2026-03-31"
    verified_by_human: false
  - id: eds_fy26_loss_makers_age_50_60
    source: sebi_eds_fy26
    applies_to: {product_class: derivative, age_band: "50_60"}
    group_key: age_50_60
    value: 85.29
    unit: percent_of_individual_traders_with_net_loss
    year: FY26
    quote: '"Table 26, row 50-60: Loss Makers 85.29%" (p. 69)'
    as_of: "2026-03-31"
    verified_by_human: false
  - id: eds_fy26_loss_makers_age_gt_60
    source: sebi_eds_fy26
    applies_to: {product_class: derivative, age_band: gt_60}
    group_key: age_gt_60
    value: 80.95
    unit: percent_of_individual_traders_with_net_loss
    year: FY26
    quote: '"Table 26, row >60: Loss Makers 80.95%" (p. 69)'
    as_of: "2026-03-31"
    verified_by_human: false
  - id: eds_fy26_cost_share_of_losses
    source: sebi_eds_fy26
    applies_to: {card: trading_costs_derivative}
    group_key: loss_makers
    value: 35
    unit: percent_of_gross_losses_that_were_transaction_costs
    year: FY26
    quote: '"Transaction costs accounted for 35% of gross losses of loss-makers, compared with 21% of gross profits of profit-makers." (p. 66)'
    as_of: "2026-03-31"
    verified_by_human: false

  # --- Intraday equity cash, FY23 ------------------------------------------------
  - id: intraday_fy23_loss_makers_all
    source: sebi_intraday_fy23
    applies_to: {product_class: cash_equity, holding_intent: intraday, age_band: null}
    group_key: all_individuals
    value: 71
    unit: percent_of_individual_intraday_traders_with_net_loss
    year: FY23
    quote: '"7 out of 10 individual intraday traders (71%) in equity cash segment incurred net losses in FY23." (p. 2)'
    as_of: "2023-03-31"
    verified_by_human: false
  - id: intraday_fy23_loss_makers_age_lt_30
    source: sebi_intraday_fy23
    applies_to: {product_class: cash_equity, holding_intent: intraday, age_band: lt_30}
    group_key: age_lt_30
    value: 76
    unit: percent_of_individual_intraday_traders_with_net_loss
    year: FY23
    quote: '"The percentage of loss-makers for younger traders (age less than 30 years) was higher (76% in FY23) as compared to other age groups." (p. 2)'
    as_of: "2023-03-31"
    verified_by_human: false
  - id: intraday_fy23_costs_added_to_losses
    source: sebi_intraday_fy23
    applies_to: {card: trading_costs_intraday}
    group_key: loss_makers
    value: 57
    unit: percent_added_to_trading_losses_by_trading_costs
    year: FY23
    quote: '"In FY23, loss-makers exacerbated their trading losses by 57% due to trading costs." (p. 2)'
    as_of: "2023-03-31"
    verified_by_human: false
