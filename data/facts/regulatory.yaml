capital_gains_listed_equity:
  value:
    applies_to: "Listed equity shares, units of equity-oriented mutual funds and business trusts, where STT is paid"
    long_term_holding_months: 12
    short_term_rate_pct: 20
    long_term_rate_pct: 12.5
    long_term_exempt_up_to_inr: 125000
    effective_for_transfers_from: "2024-07-23"
  source_title: "Income Tax Department: Tax on short-term / long-term capital gains; CBDT FAQs on the new capital gains regime (Union Budget 2024-25)"
  source_url: "https://www.incometaxindia.gov.in/w/tax-on-long-term-capital-gains%E2%80%8B"
  as_of: "2024-07-23"
  verified_by_human: false
  checked_note: >-
    2026-10-04: Income-tax Act, 2025, section 196 ("Tax on short-term capital gains in certain
    cases") on incometaxindia.gov.in gives 20% for STT-paid listed equity, equity-oriented fund and
    business trust units. Also confirmed on incometaxindia.gov.in pages "Tax on short-term capital gains"
    ("STCG covered under section 111A is charged to tax at the rate of 20%" from 23-07-2024) and
    "Tax on long-term capital gains" (12.5% above Rs 1,25,000; 12-month holding for listed shares).
    Those pages describe the Income-tax Act, 1961 "as amended by the Finance Act, 2026".
  todo_verify: >-
    TODO_VERIFY: the long-term rate (12.5% above Rs 1,25,000) is confirmed on the Income Tax
    Department's 1961-Act page and by secondary sources for the 2025 Act, but its 2025-Act section
    was not opened. Ruko states no section numbers and gives no personal tax computation.

derivatives_loss_can_exceed_margin:
  value: >-
    In derivatives, if prices move against you, you may lose part or all of the margin you put
    in, and the loss may exceed the original margin amount.
  quote: '"If the prices move against you, you may lose a part of or whole margin equivalent to the principal investment amount in a relatively short period of time. Moreover, the loss may exceed the original margin amount." (section 2.1, Effect of "Leverage" or "Gearing")'
  source_title: "SEBI: Annexure 4, Combined Risk Disclosure Document for Capital Market/Cash Segment and Futures & Options Segment"
  source_url: "https://www.sebi.gov.in/sebi_data/commondocs/ann4_p.pdf"
  as_of: "2026-10-04"
  verified_by_human: false
  checked_note: "Quote checked verbatim against the PDF on 2026-10-04. The document carries no version date; as_of is the check date."

ia_no_assured_returns:
  value: >-
    SEBI-registered investment advisers are prohibited from guaranteeing returns.
  quote: '"No Misrepresentation - Prohibited from guaranteeing returns or mis-selling products."'
  source_title: "SEBI investor website: Securities Market Investment: Understanding Investment Advisors (code of conduct)"
  source_url: "https://investor.sebi.gov.in/investment_advisor.html"
  as_of: "2026-10-04"
  verified_by_human: false
  checked_note: >-
    Quote checked on the live SEBI page on 2026-10-04. Supporting detail (not shown to users):
    SEBI circular SEBI/HO/IMD/DF1/CIR/P/2020/182 (23 Sep 2020), Annexure A para 2(b), says advisers
    "shall not ... hold out any investment advice implying any assured returns or minimum returns or
    target return or percentage accuracy" (checked via a reproduction at lexibox.in). Scope: this
    rule is about investment advisers, so cards must not extend it to every registered entity.

