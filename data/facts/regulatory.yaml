# Regulatory facts used by signals, cards and recovery. Every entry: value, source_url,
# source_title, as_of, verified_by_human. Nothing here is verified until the repo owner checks it.

upi_validated_handles:
  value:
    summary: >-
      SEBI-registered investor-facing intermediaries must obtain and offer UPI IDs of the form
      <username>.<category>@valid<bank>, e.g. abc.brk@validhdfc (broker) or xyz.mf@validhdfc
      (mutual fund). Payments to them show a white thumbs-up inside a green triangle.
      Using this UPI mechanism is optional for investors, who may also pay by IMPS, NEFT,
      RTGS or cheque; if an investor pays a registered intermediary by UPI, it must be to
      the new UPI ID.
    handle_prefix: "valid"
    category_suffixes:
      brk: stock broker
      bti: banker to an issue
      dp: depository participant
      ra: research analyst
      ia: investment adviser
      invit: infrastructure investment trust
      mf: mutual fund
      pms: portfolio manager
      sreit: SM REIT
      reit: real estate investment trust
    available_from: "2025-10-01"
  source_title: "SEBI circular SEBI/HO/DEPA-II/DEPA-II_SRG/P/CIR/2025/86: Adoption of Standardised, Validated and Exclusive UPI IDs for Payment Collection by SEBI Registered Intermediaries from Investors"
  source_url: "https://www.sebi.gov.in/legal/circulars/jun-2025/adoption-of-standardised-validated-and-exclusive-upi-ids-for-payment-collection-by-sebi-registered-intermediaries-from-investors_94535.html"
  as_of: "2025-06-11"
  verified_by_human: false
  note: >-
    Ruko only checks whether a handle *looks like* this pattern. That is not verification.
    Ruko never says a payee is registered; it points the user to SEBI Check.

