# Questions that ask Ruko for a safety verdict ("is this a scam?", "is this app safe?").
# These are NOT refused: Ruko runs the normal analysis and adds a fixed line saying it
# cannot vouch for any tip, app or person. It never answers yes or no.
verdict_requests:
  en:
    - '\b(is|are)\b.{0,30}\b(this|it|that|they|these|the app|the group|the site|the platform|the scheme)\b.{0,20}\b(a )?(scam|fraud|fake|legit|legitimate|genuine|real|safe|trustworthy|reliable)\b'
    - '\b(scam|fraud|fake|legit|genuine)\b.{0,10}\b(or not|\?)'
    - '\bcan i trust\b'
  hi:
    - '(फ्रॉड|फ़्रॉड|धोखा|स्कैम|असली|नकली|सुरक्षित|भरोसेमंद).{0,15}(है|हैं).{0,10}(क्या|या नहीं|\?)'
    - 'क्या.{0,30}(फ्रॉड|फ़्रॉड|धोखा|स्कैम|असली|नकली|सुरक्षित|भरोसेमंद)'
  hi_latn:
    - '\b(fraud|froud|scam|dhokha|asli|nakli|safe|surakshit|bharosemand)\b.{0,15}\b(hai|h)\b.{0,10}\b(kya|ya nahi)\b'
    - '\bkya\b.{0,30}\b(fraud|froud|scam|dhokha|asli|nakli|safe|surakshit)\b'
  kn:
    - '(ಮೋಸ|ವಂಚನೆ|ಸ್ಕ್ಯಾಮ್|ನಕಲಿ|ಅಸಲಿ|ಸುರಕ್ಷಿತ|ನಂಬಬಹುದಾ).{0,15}(ಆ\?|ಹೌದಾ|ಅಲ್ವಾ|ಇದೆಯಾ|ಆಗಿದೆಯಾ|\?|ನಾ)'
  kn_latn:
    - '\b(mosa|moosa|vanchane|scam|fraud|nakali|asali|safe|nambabahuda|nambbahuda)\b.{0,15}\b(aa|na|haudaa|alva|ideya)\b'

# Cues that a message contains text addressed to an AI. Inputs are never refused for this;
# the content is handled strictly as data and the cue is recorded in the trace.
injection_cues:
  - '\bignore\b.{0,20}\b(all|any|your|previous|prior|above|earlier|the)\b.{0,20}\b(rules|instructions|prompts?|guidelines|policies)\b'
  - '\b(disregard|forget|override|bypass)\b.{0,20}\b(rules|instructions|prompts?|guidelines|policies|guardrails|filters?)\b'
  - '\b(system prompt|developer message|system message|hidden instructions)\b'
  - '\b(as an ai|ai model|language model|llm|chatgpt|gemini|assistant)\b.{0,40}\b(say|reply|respond|output|answer|tell|print)\b'
  - '\b(say|reply|respond|output|print|answer)\b.{0,15}["''“”]?\b(buy|sell|hold|safe|legit|genuine|guaranteed)\b'
  - '(नियम|निर्देश).{0,15}(भूल|अनदेखा|इग्नोर)'
  - '\b(rules|niyam|instructions)\b.{0,15}\b(bhool|bhul|ignore)\b'
  - '(ನಿಯಮ|ಸೂಚನೆ).{0,15}(ಮರೆತು|ನಿರ್ಲಕ್ಷಿಸಿ|ಇಗ್ನೋರ್)'

# Secrets the user must never share. Any hit refuses processing with a warning.
# Card numbers are additionally checked with the Luhn algorithm in code.
sensitive_data:
  message_key: refusal.sensitive_data.message
  alternative_key: refusal.sensitive_data.alternative
  patterns:
    otp:
      - '\b(otp|one[- ]time[- ]password|verification code|security code|login code)\b[^0-9]{0,25}\d{4,8}\b'
      - '\b\d{4,8}\b[^0-9]{0,15}\b(is your|is the) (otp|one[- ]time[- ]password|verification code)'
      - '(ओटीपी|ओ टी पी)[^0-9]{0,25}\d{4,8}'
      - '(ಒಟಿಪಿ|ಓಟಿಪಿ)[^0-9]{0,25}\d{4,8}'
    pin:
      - '\b(upi[- ]?pin|atm[- ]?pin|card pin|m[- ]?pin|mpin|t[- ]?pin|tpin|my pin|mera pin|meri pin|nanna pin|pin is|pin number is)\W{0,15}\d{4,6}\b'
      - '\bpin\W{0,5}\d{4}(?!\d)'
      - '(यूपीआई पिन|एटीएम पिन|मेरा पिन)[^0-9]{0,15}\d{4,6}'
      - '(?<![\u0900-\u097F])पिन\W{0,5}\d{4}(?!\d)'
      - '(ಯುಪಿಐ ಪಿನ್|ಎಟಿಎಂ ಪಿನ್|ನನ್ನ ಪಿನ್)[^0-9]{0,15}\d{4,6}'
      - '(?<![\u0C80-\u0CFF])ಪಿನ್\W{0,5}\d{4}(?!\d)'
    cvv:
      - '\b(cvv|cvc|cvv2|card verification)\b[^0-9]{0,25}\d{3,4}\b'
    password:
      - '\b(password|passcode|passwd|pwd|login password|trading password)\b\s*(is|:|=|-)\s*(?=\S*[0-9@#$%&*!])\S{4,}'
      - '\b(my|mera|meri|nanna) (password|passcode|pwd)\b'
      - '\b(password|passcode|pwd)\b[^.?!\n]{0,40}\b(is|:|=)\s*(?=\S*[0-9@#$%&*!])\S{4,}'
      - '(पासवर्ड).{0,10}(है|:)\s*\S{4,}'
      - '(पासवर्ड)\s+(?=\S*[0-9@#$%&*!])\S{4,}'
      - '(ಪಾಸ್‌ವರ್ಡ್|ಪಾಸ್ವರ್ಡ್).{0,10}\S{4,}'
    own_account_number:
      - '\b(my|mera|meri|mere|nanna|namma)\b.{0,15}(account|a/c|acct|khata|bank account|demat account)[^0-9]{0,25}\d{9,18}\b'
      - '(मेरा|मेरे|मेरी).{0,15}(खाता|अकाउंट|एकाउंट).{0,20}\d{9,18}'
      - '(ನನ್ನ).{0,15}(ಖಾತೆ|ಅಕೌಂಟ್).{0,20}\d{9,18}'
  card_number_regex: '(?<!\d)(?:\d[ -]?){12,18}\d(?!\d)'

# Output filter: patterns that are ALWAYS forbidden in every outgoing string (trade directives,
# price/outcome predictions, named brokers and platforms). Claim words that Ruko may report but
# never assert (guaranteed returns, "safe", "legit") live in data/policy/output_policy.yaml and
# are checked per response type by guardrails/output_validator.py.
output_filter:
  fallback_key: output.blocked_fallback
  forbidden:
    trade_directive:
      - '\b(you|u)\b.{0,5}\b(should|must|need to|have to|ought to)\b.{0,12}\b(buy|sell|hold|short|accumulate|exit|enter)\b'
      - '\b(i|we)\b.{0,5}\b(recommend|suggest|advise)\b.{0,20}\b(buy|sell|hold|invest|stock|share|fund|ipo|broker|app)'
      - '\b(strong |good )?(buy|sell|hold|accumulate|short)\b (signal|call|rating|now|today|immediately|at ₹|at rs|above|below)\b'
      - '\b(buy|sell|short|accumulate|hold) (it|this|that|these|the stock|the share|the fund)\b'
      - '\b(go long|go short|buy on dips?|book (your )?profits? (now|today|at))\b'
      - '\b(recommended|recommend) (stock|share|fund|ipo|scheme|broker|app)s?\b'
      - '(?<![\u0900-\u097F])(खरीद लो|खरीद लें|ख़रीद लें|खरीदें|ख़रीदें|बेच दो|बेच दें|बेचें|होल्ड करें|निवेश करें|इन्वेस्ट करें)(?![\u0900-\u097F])'
      - '\b(khareed lo|kharid lo|kharid lein|khareed lein|bech do|bech dein|hold karo|invest karo|invest karein)\b'
      - '(?<![\u0C80-\u0CFF])(ಖರೀದಿಸಿ|ಕೊಳ್ಳಿ|ಮಾರಿ|ಮಾರಾಟ ಮಾಡಿ|ಹೂಡಿಕೆ ಮಾಡಿ|ಹೋಲ್ಡ್ ಮಾಡಿ)(?![\u0C80-\u0CFF])'
      - '\b(kharidi|tagoli|maari|invest maadi|invest madi)\b'
    price_prediction:
      - '\b(will|is going to|going to|set to|expected to|likely to)\b.{0,15}\b(go up|go down|rise|fall|crash|double|triple|moon|rally|reach|hit|cross|touch|recover)\b'
      - '\b(target|tgt|price target)\b\s*(price)?\s*[:@\-]?\s*(₹|rs\.?|inr)?\s*\d'
      - '\b(sl|stop ?loss)\b\s*[:@\-]?\s*(₹|rs\.?|inr)?\s*\d'
      - '(बढ़ेगा|गिरेगा|ऊपर जाएगा|डबल होगा|टारगेट\s*\d)'
      - '(ಏರುತ್ತದೆ|ಇಳಿಯುತ್ತದೆ|ಡಬಲ್ ಆಗುತ್ತದೆ|ಟಾರ್ಗೆಟ್\s*\d)'
  # Names are listed ONLY so that Ruko can never promote them. Ruko text never names a
  # broker, trading app, exchange-traded product brand or crypto platform.
  name_blocklist:
    - zerodha
    - kite by zerodha
    - groww
    - upstox
    - angel one
    - angel broking
    - icici direct
    - icicidirect
    - hdfc securities
    - kotak securities
    - kotak neo
    - 5paisa
    - dhan
    - paytm money
    - sharekhan
    - motilal oswal
    - fyers
    - samco
    - sbi securities
