        - '\bif you were (me|in my place|in my shoes)\b.{0,40}\b(would|will|should)\b'
        - '\b(what|which)\b.{0,15}\b(stocks?|shares?|funds?|ipos?|options?|coins?|crypto|calls?|scrips?)\b.{0,25}\b(should|to|can|do|must)\b.{0,10}\b(i |we )?(buy|invest|pick|choose|trade|get)'
        - '\btell me (what|which|where)\b.{0,30}\b(buy|sell|invest|trade)'
        - '\b(suggest|recommend|give|send|share)\b.{0,10}\b(me|us)?\b.{0,10}\b(an? |some |good |best |few )?(stocks?|shares?|funds?|ipos?|tips?|calls?|scrips?|options trade|trades?)\b.{0,15}(to buy|to invest|for me|for us|\?|$)'
        - '\b(buy,? sell,? or hold|buy or sell|sell or hold|buy or hold|hold or sell)\b'
        - '\b(is it|is now) (a )?(good|right|the right|best) time to (buy|sell|invest|enter|exit)'
        - '\bwhere (should|can|do) (i|we) (invest|put)'
        - '\bhow much (should|do) (i|we) (invest|buy|put)'
        - '\b(pick|choose|select|name)\b.{0,20}\b(stocks?|shares?|funds?|ipos?|coins?)\b.{0,10}\b(for me|for us)\b'
        - '\b(if you had to|if you were (me|in my place|in my shoes)|in my (place|shoes))\b.{0,50}\b(buy|sell|invest|pick|choose|hold)\b'
        # "Which fund gives the best return?" asks Ruko to pick a product (phase 2, P1).
        - '\b(which|what)\b.{0,20}\b(stocks?|shares?|funds?|mutual funds?|sips?|ipos?|schemes?|plans?|coins?|options?|polic(y|ies))\b.{0,30}\b(best|highest|most|top|maximum|max|better|good)\b.{0,15}\b(returns?|profits?|growth|gains?|interest|performing)\b'
        - '\b(best|top|highest[- ]return(ing)?|best[- ]performing)\b.{0,5}\b(stocks?|shares?|funds?|mutual funds?|sips?|ipos?|schemes?|coins?)\b'
      hi:
        - 'क्या (मैं|मुझे|हम|हमें).{0,30}(खरीद|ख़रीद|बेच|निवेश|इन्वेस्ट|होल्ड|लगा|लेना चाहिए|ले लूँ|ले लूं|लूँ|लूं|रखना चाहिए|रखूँ|रखूं)'
