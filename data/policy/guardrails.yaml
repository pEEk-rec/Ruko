        - 'ಯಾವ.{0,10}(ಷೇರು|ಷೇರ್|ಶೇರು|ಸ್ಟಾಕ್|ಫಂಡ್|ಐಪಿಓ).{0,25}(ಖರೀದಿಸಲಿ|ಕೊಳ್ಳಲಿ|ತಗೋಳ್ಳಲಿ|ತಗೊಳ್ಳಲಿ|ತಗೋಬೇಕು|ಖರೀದಿಸಬೇಕು|ಹೂಡಿಕೆ ಮಾಡಲಿ|ಒಳ್ಳೆಯದು)'
        - '(ಹೇಳಿ|ಹೇಳು|ತಿಳಿಸಿ).{0,30}(ಏನು|ಯಾವ).{0,20}(ಖರೀದಿಸ|ಕೊಳ್ಳ|ಮಾರ|ಹೂಡಿಕೆ)'
        - '(ತಗೊಳ್ಳಲಾ|ತಗೋಳ್ಳಲಾ|ತಗೋಳ್ಲಾ|ಕೊಳ್ಳಲಾ|ಖರೀದಿಸಲಾ|ಮಾರಲಾ|ಮಾರಾಟ ಮಾಡಲಾ|ಹಾಕಲಾ|ಹೂಡಲಾ|ಹೂಡಿಕೆ ಮಾಡಲಾ)'
        - 'ಯಾವ.{0,10}(ಷೇರು|ಷೇರ್|ಶೇರು|ಸ್ಟಾಕ್|ಫಂಡ್|ಐಪಿಓ).{0,25}(ಕೊಳ್ಳಬೇಕು|ತಗೊಳ್ಳಬೇಕು|ತಗೋಬೇಕು|ಹಾಕಬೇಕು|ಮಾರಬೇಕು)'
        - 'ಯಾವ.{0,10}(ಷೇರು|ಷೇರ್|ಶೇರು|ಸ್ಟಾಕ್|ಫಂಡ್|ಎಸ್‌ಐಪಿ|ಎಸ್ಐಪಿ|SIP|ಸ್ಕೀಮ್).{0,30}(ಹೆಚ್ಚು ಲಾಭ|ಹೆಚ್ಚು ರಿಟರ್ನ್|ಅತ್ಯುತ್ತಮ|ಉತ್ತಮ|ಬೆಸ್ಟ್)'
