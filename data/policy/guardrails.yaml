        - 'क्या.{0,30}(शेयर|स्टॉक|फंड|फ़ंड|आईपीओ).{0,20}(अच्छा|अच्छी|बढ़िया|सही|खराब)'
        - '(खरीदने|निवेश करने) (लायक|लायक़) (है|हैं)'
        - '(कौन सा|कौनसा|कौन से|कौनसे|कौन-सा).{0,25}(शेयर|स्टॉक|फंड|फ़ंड|आईपीओ|स्कीम).{0,20}(सबसे अच्छा|सबसे अच्छी|बेस्ट|अच्छा|बढ़िया|बेहतर)'
        - '(यह|ये|इस).{0,20}(शेयर|स्टॉक|फंड|फ़ंड|आईपीओ|स्कीम).{0,10}(अच्छा|अच्छी|बढ़िया|सही|खराब).{0,10}(है|हैं).{0,5}(या नहीं|\?)'
      hi_latn:
        - '\bkya\b.{0,30}\b(share|stock|fund|ipo|company)\b.{0,20}\b(accha|achha|acha|badhiya|sahi|kharab|bekar)\b'
        - '\b(accha|achha|acha|badhiya|sahi)\b.{0,10}\b(share|stock|fund|ipo)\b.{0,10}\b(hai|h)\b.{0,10}\b(kya|\?)'
        - '\b(kharidne|invest karne) (layak|laayak|lyk)\b'
      kn:
        - '(ಒಳ್ಳೆಯ|ಒಳ್ಳೆ|ಉತ್ತಮ|ಕೆಟ್ಟ).{0,10}(ಷೇರು|ಷೇರ್|ಶೇರು|ಸ್ಟಾಕ್|ಫಂಡ್|ಹೂಡಿಕೆ|ಐಪಿಓ|ಕಂಪನಿ).{0,15}(ಆ\?|ಹೌದಾ|ಅಲ್ವಾ|ಇದೆಯಾ|ಆಗಿದೆಯಾ|\?)'
        - '(ಷೇರು|ಷೇರ್|ಶೇರು|ಸ್ಟಾಕ್|ಫಂಡ್|ಐಪಿಓ).{0,20}(ಒಳ್ಳೆಯದಾ|ಒಳ್ಳೇದಾ|ಒಳ್ಳೆಯದೇ|ಚೆನ್ನಾಗಿದೆಯಾ|ಉತ್ತಮವಾ)'
        - '(ಖರೀದಿಸಲು|ಕೊಳ್ಳಲು|ಹೂಡಿಕೆ ಮಾಡಲು) (ಯೋಗ್ಯ|ಲಾಯಕ್ಕು)'
        - 'ಯಾವ.{0,25}(ಷೇರು|ಷೇರ್|ಶೇರು|ಸ್ಟಾಕ್|ಫಂಡ್|ಐಪಿಓ|ಯೋಜನೆ).{0,15}(ಉತ್ತಮ|ಒಳ್ಳೆಯದು|ಬೆಸ್ಟ್|ಚೆನ್ನಾಗಿದೆ)'
      kn_latn:
