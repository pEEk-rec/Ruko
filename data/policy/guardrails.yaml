        - '(खरीदूं|खरीदूँ|ख़रीदूँ).{0,5}(या|या फिर).{0,5}(बेचूं|बेचूँ)'
        - '(बताओ|बताइए|बताइये|बताएं).{0,30}(क्या|कौन सा|कौनसा).{0,20}(खरीद|ख़रीद|बेच|निवेश)'
        - 'कहाँ (निवेश|इन्वेस्ट) (करूं|करूँ|करें)'
        - '(कौन सा|कौनसा|कौन से|कौनसे|कौन-सा|किस).{0,15}(फंड|फ़ंड|शेयर|स्टॉक|एसआईपी|SIP|स्कीम).{0,30}(सबसे ज़्यादा|सबसे ज्यादा|सबसे अच्छा|सबसे बढ़िया|बेस्ट|ज़्यादा रिटर्न|ज्यादा रिटर्न)'
        - '(सबसे अच्छा|सबसे अच्छे|सबसे बढ़िया|बेस्ट|सबसे ज़्यादा रिटर्न वाला|सबसे ज्यादा रिटर्न वाला).{0,5}(फंड|फ़ंड|शेयर|स्टॉक|एसआईपी|SIP|स्कीम)'
