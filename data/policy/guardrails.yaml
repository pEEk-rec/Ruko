    alternative_key: refusal.alternative
    patterns:
      en:
        - '\bshould ?(i|we)\b.{0,40}\b(buy|buying|sell|selling|hold|invest|exit|enter|short|book|average|accumulate|put money|go long|go short|add more|buy more|invest more|top up|average down)\b'
