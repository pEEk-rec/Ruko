# Guardrail policy: refusal classes, sensitive-data patterns, prompt-injection cues
# and the output filter. Deterministic; read by src/ruko/guardrails/.
#
# Pattern rules
# - Python regular expressions, matched case-insensitively on normalized text
#   (NFKC, lower-case, zero-width characters removed, single spaced). A second pass
#   matches on a "de-obfuscated" variant (leetspeak and s-p-a-c-e-d letters undone).
# - Patterns of every language are applied to every input, so code-mixed text is covered.
# - Indic-script patterns do not use \b (combining vowel signs are not word characters).
# - Advice / prediction patterns are QUESTION-SHAPED: they target a user asking Ruko,
#   not a forwarded tip that contains "buy now" (tips are exactly what Ruko analyzes).

version: "1"

refusal_classes:
  ROLEPLAY_ADVISOR:
    message_key: refusal.roleplay_advisor.message
    alternative_key: refusal.alternative
    patterns:
      en:
        - '\b(pretend|act|behave|role ?play|roleplay)\b.{0,25}\b(you are|you''re|to be|as|like)\b.{0,30}(advis[eo]r|planner|broker|analyst|expert|guru|tipster|fund manager|wealth manager)'
        - '\byou are (now )?(my|a|an)\b.{0,25}\b(advis[eo]r|planner|analyst|broker|stock expert|trading expert|guru|tipster)'
        - '\bimagine (you are|you were|you''re)\b.{0,40}\b(advis[eo]r|analyst|expert|broker|trader)'
        - '\bas my (financial |investment |stock |personal )?(advis[eo]r|planner|analyst)\b'
        - '\byou are now\b.{0,40}\b(advis[eo]r|analyst|expert|guru|tipster|broker|planner)'
        - '\b(developer|dev|god|jailbreak|dan) mode\b'
        - '\bhypothetical(ly)?\b.{0,60}\b(buy|sell|invest|which stock|which share|which fund|price)'
      hi:
        - 'मान (लो|लीजिए|लें).{0,30}(तुम|आप).{0,30}(सलाहकार|एडवाइज़र|एडवाइजर|विशेषज्ञ|एक्सपर्ट|ब्रोकर)'
        - '(तुम|आप) (अब )?मेरे.{0,20}(सलाहकार|एडवाइज़र|एडवाइजर)'
        - '(सलाहकार|एडवाइज़र|एडवाइजर|विशेषज्ञ|एक्सपर्ट|ब्रोकर).{0,3}(बनकर|बन कर|बनो|बन जाओ|की तरह)'
      hi_latn:
        - '\b(maan|man|maano|mano) (lo|lijiye|lijie)\b.{0,30}\b(tum|aap|ap)\b.{0,30}\b(advis[eo]r|salahkar|expert|broker)'
        - '\b(tum|aap|ap) (ab )?mere\b.{0,20}\b(advis[eo]r|salahkar)'
      kn:
        - '(ನೀನು|ನೀವು).{0,30}(ಸಲಹೆಗಾರ|ಅಡ್ವೈಸರ್|ತಜ್ಞ|ಬ್ರೋಕರ್).{0,20}(ಅಂತ|ಎಂದು|ಎಂಬಂತೆ)'
        - '(ನನ್ನ) (ಹಣಕಾಸು )?(ಸಲಹೆಗಾರ|ಅಡ್ವೈಸರ್).{0,10}(ಆಗಿ|ಆಗು)'
        - '(ಸಲಹೆಗಾರ|ಅಡ್ವೈಸರ್|ತಜ್ಞ|ಬ್ರೋಕರ್).{0,4}(ನಂತೆ|ಹಾಗೆ|ತರಹ)'
      kn_latn:
        - '\b(neenu|neevu|nivu)\b.{0,30}\b(advis[eo]r|salahegara|expert|broker)\b.{0,20}\b(antha|anta|aagi|agi)\b'

  ADVICE_REQUEST:
