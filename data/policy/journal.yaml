# Journal review (Stages 10, v2). The journal lives on the device; the server only computes
# the user's own patterns for one request (docs/impact_metrics.md) and keeps nothing.
version: "2"

# Source types counted as "started from an unsolicited tip".
tip_source_types: [unsolicited_group, influencer]

# Levels that count as Ruko stepping in, and levels that count as a pause.
intervention_levels: [L1, L2, L3]
pause_levels: [L2, L3]

# Weekly interventions-per-decision points are returned for the last 12 weeks. They are
# shown as data, never as a success score.
weeks_window: 12

# Below this many entries, numbers are returned but the highlights say it's too early.
min_entries_for_patterns: 3
