# Clarifying questions. Deterministic: which DecisionEvent fields the engine
# needs, in which order Ruko asks for them, and the answer choices.
#
# Amount and funding source are NEVER inferred from a message; only the user gives them.
version: "1"

# Ask at most this many questions in one round.
max_questions: 3

# When the message carries a content signal of this severity tier or higher (see
# data/policy/intervention.yaml), the warning is shown immediately and no questions are
# asked first: a high-severity fraud pattern must not wait behind a form.
skip_when_content_severity: high

# Asked in this order, only for a financial decision and only when still unknown.
fields:
  - field: amount_inr
    question_key: clarify.amount_inr.question
    options: []            # free numeric input (whole rupees)
  - field: funding_source
    question_key: clarify.funding_source.question
    options: [savings, borrowed, emergency_fund, protected_goal, unknown]
  - field: product_class
    question_key: clarify.product_class.question
    options: [cash_equity, derivative, ipo, mutual_fund, scheme_or_app, crypto, unknown]

# One-tap help, never applied without a tap.
# amount_hints: whole-rupee amounts the user's own message mentions (up to this many) are offered
#   as "The message mentions ₹5,000". Amount is still only ever the user's answer.
# suggest: an answer choice that matches what the message describes gets a tag, when any of these
#   content signals were found. A tag is a pointer, not a verdict.
amount_hints: 2
suggest:
  product_class:
    scheme_or_app:
      - GUARANTEED_RETURN_CLAIM
      - PAY_TO_INDIVIDUAL_ACCOUNT
      - APP_INSTALL_REQUEST
      - UNVERIFIED_PLATFORM_LINK
      - IMPERSONATION_SUSPECTED
      - WITHDRAWAL_FEE_DEMAND
