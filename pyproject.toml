[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruko"
version = "0.1.0"
description = "Ruko: a decision-safety layer for Indian retail investors (backend)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-genai>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not live\""
markers = [
    "live: calls a real external provider; needs API keys; never part of the main suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN", "D"]
ignore = [
    "D203",   # one blank line before class docstring (conflicts with D211)
    "D213",   # multi-line summary second line (conflicts with D212)
    "D107",   # __init__ docstring (class docstring is enough)
    "ANN401", # Any is allowed where a value is truly opaque
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"eval/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
