# Ruko evaluation dataset.
#
# Every message is written for this evaluation. No real personal data: phone numbers,
# UPI IDs and names are made up. origin:
#   synthetic       - written from scratch
#   public_pattern  - written from scratch, modelled on scam patterns that SEBI, exchanges
#                     and police have publicly warned about (fake trading groups, fake apps,
#                     withdrawal "taxes", impersonation). No text is copied from a real scam.
#
# Labels were written by reading each message as a careful human would, before running
# Ruko on it, and are not changed to match Ruko's output.
#
# expect:
#   kind: pause | refusal
#   refusal_class: for refusals
#   signals: message-pattern codes a careful reader would flag (empty = none)
#   product_class: when the message makes it clear
#   financial: whether the message is about putting money somewhere
version: "1"

items:
