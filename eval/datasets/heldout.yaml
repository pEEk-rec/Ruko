  - {id: ho-acted-kn-01, lang: kn, origin: public_pattern, category: already_acted, text: "ಅವರು ಕೊಟ್ಟ UPI ಗೆ 5,000 ರೂಪಾಯಿ ಕಳುಹಿಸಿಬಿಟ್ಟೆ.", expect: {stage: already_acted, kind: recovery, scenario: paid_scammer}}
  - {id: ho-acted-kn-02, lang: kn, origin: public_pattern, category: already_acted, text: "ಹಣ ವಿತ್‌ಡ್ರಾ ಆಗುತ್ತಿಲ್ಲ, ಅವರು ಶುಲ್ಕ ಕೇಳುತ್ತಿದ್ದಾರೆ.", expect: {stage: already_acted, kind: recovery, scenario: cannot_withdraw}}
