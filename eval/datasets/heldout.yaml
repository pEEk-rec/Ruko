  - {id: ho-scam-kn-01, lang: kn, origin: public_pattern, category: scam, text: "ಸದಸ್ಯರಿಗೆ ಮಾತ್ರ: ಅಡ್ಮಿನ್‌ನ ಫೋನ್‌ಪೇಗೆ ಹಣ ಕಳುಹಿಸಿ, ಇಂದೇ ಕೊನೆಯ ದಿನ.", expect: {stage: consider_action, kind: pause, signals: [PAY_TO_INDIVIDUAL_ACCOUNT, URGENCY_PRESSURE, UNSOLICITED_SOURCE]}}
