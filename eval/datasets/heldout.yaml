  # ===================== already_acted (recovery, no pause) =====================
  - {id: ho-acted-en-01, lang: en, origin: public_pattern, category: already_acted, text: "I already paid Rs 10,000 to the UPI ID they gave me and now they are not replying.", expect: {stage: already_acted, kind: recovery, scenario: paid_scammer}}
  - {id: ho-acted-en-02, lang: en, origin: public_pattern, category: already_acted, text: "I can't withdraw my money, they want a 20% fee first.", expect: {stage: already_acted, kind: recovery, scenario: cannot_withdraw}}
  - {id: ho-acted-en-03, lang: en, origin: public_pattern, category: already_acted, text: "I installed the app they sent and gave them screen access.", expect: {stage: already_acted, kind: recovery, scenario: suspicious_app_installed}}
  - {id: ho-acted-en-04, lang: en, origin: synthetic, category: already_acted, text: "My broker placed a trade in my account that I did not authorise.", expect: {stage: already_acted, kind: recovery, scenario: unauthorized_trade}}
  - {id: ho-acted-en-05, lang: en, origin: public_pattern, category: already_acted, text: "I sent money yesterday and the group admin has blocked me.", expect: {stage: already_acted, kind: recovery, scenario: paid_scammer}}
