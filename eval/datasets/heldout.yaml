  # ===================== evaluate_content (content report, no verdict) =====================
  - {id: ho-eval-en-01, lang: en, origin: public_pattern, category: evaluate_content, text: "Is this message normal? 'Guaranteed 4% daily profit, join our VIP group today.'", expect: {stage: evaluate_content, kind: content_report, signals: [GUARANTEED_RETURN_CLAIM, UNSOLICITED_SOURCE, URGENCY_PRESSURE]}}
  - {id: ho-eval-en-02, lang: en, origin: public_pattern, category: evaluate_content, text: "Is this real? They say pay 15% tax to release my profits.", expect: {stage: evaluate_content, kind: content_report, signals: [WITHDRAWAL_FEE_DEMAND]}}
  - {id: ho-eval-en-03, lang: en, origin: synthetic, category: evaluate_content, text: "Is this message genuine? 'Your SIP of Rs 1,000 will be debited on the 5th.'", expect: {stage: evaluate_content, kind: content_report, signals: []}}
  - {id: ho-eval-hi-01, lang: hi, origin: public_pattern, category: evaluate_content, text: "क्या यह मैसेज सही है? 'रोज़ 3% पक्का मुनाफा, अभी जुड़ें'", expect: {stage: evaluate_content, kind: content_report, signals: [GUARANTEED_RETURN_CLAIM, URGENCY_PRESSURE]}}
  - {id: ho-eval-hi-02, lang: hi, origin: public_pattern, category: evaluate_content, text: "यह असली है या नकली? 'सेबी अधिकारी: पेनल्टी फीस भरें वरना खाता बंद'", expect: {stage: evaluate_content, kind: content_report, signals: [IMPERSONATION_SUSPECTED]}}
  - {id: ho-eval-kn-01, lang: kn, origin: public_pattern, category: evaluate_content, text: "ಈ ಮೆಸೇಜ್ ನಿಜವೇ? 'ದಿನಕ್ಕೆ 2% ಖಚಿತ ಲಾಭ, ಇಂದೇ ಸೇರಿ'", expect: {stage: evaluate_content, kind: content_report, signals: [GUARANTEED_RETURN_CLAIM, URGENCY_PRESSURE]}}
  - {id: ho-eval-kn-02, lang: kn, origin: public_pattern, category: evaluate_content, text: "ಇದು ಸರಿಯಾದ ಮೆಸೇಜಾ? 'ಹಣ ಹಿಂಪಡೆಯಲು ಮೊದಲು ತೆರಿಗೆ ಕಟ್ಟಿ'", expect: {stage: evaluate_content, kind: content_report, signals: [WITHDRAWAL_FEE_DEMAND]}}
  - {id: ho-eval-hil-01, lang: hi_latn, origin: public_pattern, category: evaluate_content, text: "Ye message sahi hai kya? 'Paisa double in 10 days'", expect: {stage: evaluate_content, kind: content_report, signals: [GUARANTEED_RETURN_CLAIM]}}

