  - {id: ho-scam-en-02, lang: en, origin: public_pattern, category: scam, text: "Congratulations! Your trading profit is Rs 7,40,000. Clear the service tax of Rs 1,10,000 to withdraw.", expect: {stage: consider_action, kind: pause, signals: [WITHDRAWAL_FEE_DEMAND]}}
  - {id: ho-scam-en-03, lang: en, origin: public_pattern, category: scam, text: "Official NSDL notice: your demat account will be frozen today. Update KYC at nsdl-kyc-verify.com", expect: {stage: consider_action, kind: pause, signals: [IMPERSONATION_SUSPECTED, UNVERIFIED_PLATFORM_LINK, URGENCY_PRESSURE]}}
